<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 4 Family Extras (lo-fi) v2</title>
<!--
  PHASE 4: FAMILY EXTRAS AND PASSES. Step 3 of 6.

  V2, forked from phase4-extras-fam-lofi.html on 24 Aug 2026 after Oliver's client call. The
  client wants to see TWO token approaches side by side:

    A. "Token packs"  - the pack-led approach this workstream has been building.
    B. "Current + quick wins" - much closer to their existing tokens page, with a short list
       of quick wins layered on.

  The toolbar's Tokens control switches between them. BOTH BRANCHES ARE DELIBERATELY IDENTICAL
  RIGHT NOW: the split exists so the two can be ideated separately without another fork. When
  B is designed, change tokensSectionCurrent() and leave tokensSectionPacks() alone.

  The original file is untouched and remains the single-approach reference.

  Rebuilt from `Phase 3-4 Sketches/phase4-extras-family-lofi.html` after a pattern review
  against the signed-off work. Where this file departs from that sketch it is because an
  established pattern already existed elsewhere in the workstream:

    - Extras card, cost display rule, scope tag and grouped breakdown
        <- phase2-dining-extras-bbw-hifi.html (the current truth for the extras step)
    - Wireframe tokens, nav pill, nav overflow affordance, section grammar
        <- phase2-dining-extras-bbw-lofi.html
    - Party blocks, "Same as Party 1" mirroring, collapse behaviour, footer summary panel,
      contextual continue button
        <- phase1-dining-fam-hifi.html / phase1-dining-fam-lofi.html
    - Party presets (1 / 2 at 2+8 / 5), party status grammar, aria-disabled never hidden
        <- phase3-accom-fam-hifi.html and the BBW unit picker handover

  DECIDED WITH OLIVER, 18 Aug 2026:
    1. Party blocks only. Every extra renders inside a party block, including the ones that
       apply to the whole booking. Those carry a shared toggle and an explicit note so the
       rule reads the same wherever the user lands. Donation is the one exception: it is a
       flat GBP 2 for the booking and cannot be split, so it keeps its own section.
    2. BBW hi-fi card anatomy: body on top, control bar underneath.
    3. Dev toolbar carries Phase 3's party presets, up to 19 guests.
    4. BBW hi-fi grouped breakdown, per party.

  Terminology is "Party", per Family convention. The sketch said "Unit"; that is BBW's word.

  NO DINING ON THIS SCREEN. Dining is chosen at step 2 and carried in read-only. The toolbar's
  Dining control switches between carried-in and skipped so the upsell path can be reviewed.

  Prices from the June 2026 live capture (content inventory v0.3, section 4b) except where
  marked. Full re-render on interaction is an accepted lo-fi limitation: keyboard focus is
  lost after each click. Do not carry that to build.
-->
<style>
/* ============================================================ WIREFRAME TOKENS
   Identical to phase2-dining-extras-bbw-lofi.html. Do not drift. */
:root{
  --ink:#2b2b2b; --ink2:#555; --muted:#6e6e6e;
  --line:#cfcfcf; --line2:#a9a9a9; --line3:#8a8a8a;
  --fill:#f2f2f2; --fill2:#e7e7e7; --fill3:#dcdcdc;
  --paper:#fff; --bg:#9a9a9a;
  --dark:#2b2b2b; --radius:10px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
/* A11Y NOTE: --muted darkened from the BBW lofi's #7a7a7a to #6e6e6e, which clears 4.5:1 on
   white for small body text. The BBW files still carry the lighter value and its caveat. */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.45;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px;}
.toolbar :focus-visible{outline-color:#fff;}
h1,h2,h3,h4{margin:0;font-weight:700;color:var(--ink);}
p{margin:0;}
ul{margin:0;padding:0;list-style:none;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;}

/* ============================================================ STAGE + TOOLBAR */
.stage{padding:18px;min-height:100vh;}
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1120px;margin:0 auto 14px;
  background:#1f1f1f;color:#eee;border-radius:10px;padding:9px 12px;font-size:12px;}
.toolbar .tlabel{font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:11px;}
.toolbar .right{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap;}
.seg-group{display:flex;align-items:center;gap:7px;}
.seg-group .gl{color:#aaa;text-transform:uppercase;letter-spacing:.05em;font-size:10px;}
.seg{display:inline-flex;border:1px solid #555;border-radius:7px;overflow:hidden;}
.seg button{background:#2b2b2b;color:#ddd;border:0;padding:5px 9px;font-size:11px;border-right:1px solid #555;}
.seg button:last-child{border-right:0;}
.seg button[aria-pressed="true"]{background:#eee;color:#1f1f1f;font-weight:700;}

/* ============================================================ DEVICE FRAME */
.frame-outer{max-width:1120px;margin:0 auto;display:flex;justify-content:center;}
.frame{position:relative;display:flex;flex-direction:column;width:1080px;height:880px;
  background:var(--paper);border:1px solid #6f6f6f;border-radius:14px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.25);}
.frame-outer[data-device="mobile"] .frame{width:390px;height:780px;}
.scroll{flex:1;overflow:auto;scroll-behavior:smooth;}

/* ============================================================ APP CHROME */
.appbar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--paper);}
.appbar .ico{width:26px;height:26px;border:1px solid var(--line2);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink2);}
.appbar .brand{font-weight:800;letter-spacing:.02em;font-size:17px;}
.appbar .brand small{display:block;font-weight:600;font-size:8px;letter-spacing:.18em;color:var(--muted);}
.appbar .icons{margin-left:auto;display:flex;gap:7px;}
.chrome-mid{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--fill);}
.backlink{color:var(--ink2);text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap;}
.step-title{text-align:center;font-size:13.5px;font-weight:800;letter-spacing:.02em;color:var(--ink);margin-bottom:10px;}
.step-row{position:relative;display:flex;align-items:center;justify-content:center;min-height:30px;}
.step-row .backlink{position:absolute;left:0;top:50%;transform:translateY(-50%);}
.dots{display:flex;align-items:center;gap:10px;}
.dotstep{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);}
.dotstep.done{background:var(--dark);border-color:var(--dark);color:#fff;}
.dotstep.current{background:var(--dark);border-color:var(--dark);color:#fff;box-shadow:0 0 0 3px var(--fill3);}
.frame-outer[data-device="mobile"] .step-row{justify-content:flex-start;gap:14px;}
.frame-outer[data-device="mobile"] .step-row .backlink{position:static;transform:none;}
.searchsum{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:12.5px;color:var(--ink2);}
.searchsum .editsum{margin-left:auto;background:var(--paper);border:1px solid var(--line2);border-radius:7px;padding:5px 10px;font-size:12px;color:var(--ink);}
.frame-outer[data-device="mobile"] .searchsum{flex-wrap:wrap;}

/* ============================================================ BODY + LAYOUT */
.body{padding:16px 18px 22px;}
/* heading only, so the gap to the nav lives on .intro rather than under the h1 */
.intro{margin-bottom:14px;}
.intro h1{font-size:31px;line-height:1.06;margin-bottom:0;text-transform:uppercase;letter-spacing:.035em;font-weight:800;text-align:center;}
.frame-outer[data-device="mobile"] .intro h1{font-size:23px;}

/* ---- section nav, lifted from phase2-dining-extras-bbw-lofi.html including the
        overflow affordance the sketch dropped: edge fades plus chevron scrollers.
        With 5 parties the nav always overflows, so this is load-bearing here. ---- */
.nav-wrap{position:sticky;top:0;z-index:4;background:var(--paper);border-bottom:1px solid var(--line);margin:0 -18px 18px;
  display:flex;align-items:center;}
.sectionnav{order:0;flex:1;min-width:0;display:flex;gap:8px;align-items:center;overflow-x:auto;padding:10px 18px;scrollbar-width:none;}
.sectionnav::-webkit-scrollbar{display:none;}
.nav-item{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;background:var(--paper);
  border:1px solid var(--line2);border-radius:20px;padding:7px 13px;font-size:13px;color:var(--ink2);}
.nav-item:hover{background:var(--fill);color:var(--ink);}
.nav-item.is-active{background:var(--dark);border-color:var(--dark);color:#fff;font-weight:700;}
.nav-tick{width:15px;height:15px;border-radius:50%;border:1px solid var(--line2);display:none;align-items:center;justify-content:center;font-size:9px;background:var(--dark);border-color:var(--dark);color:#fff;}
.nav-item.added .nav-tick,.nav-item.partial .nav-tick{display:inline-flex;}
.nav-item.partial .nav-tick{background:linear-gradient(90deg,var(--dark) 50%,var(--paper) 50%);color:transparent;}
.nav-item.is-active .nav-tick{background:#fff;border-color:#fff;color:var(--dark);}
.nav-item.is-active.partial .nav-tick{background:linear-gradient(90deg,#fff 50%,transparent 50%);border-color:#fff;color:transparent;}
/* CHEVRONS GET THEIR OWN TRACK, they are not overlaid on the scroller.
   Render check, 18 Aug: overlaid chevrons sat on top of the end pill, so "Party 5" read as
   "P >". Reserving scroll padding fixed the two ends but not the middle, because pills pass
   under an overlay anywhere in the range: at 75% scroll the right chevron still covered 28px
   of "Your booking". A track cannot be scrolled under, so it fixes the whole range.
   The track is reserved on `is-over` (overflow alone, which does not change while scrolling)
   and the chevrons only toggle VISIBILITY within it on has-left / has-right. Toggling their
   display instead would resize the scroller every time you reached an end and shift every
   pill by 40px. */
.nav-fade{position:absolute;top:0;bottom:1px;width:24px;pointer-events:none;display:none;z-index:1;}
.nav-fade-left{left:0;background:linear-gradient(to right,var(--paper),rgba(255,255,255,0));}
.nav-fade-right{right:0;background:linear-gradient(to left,var(--paper),rgba(255,255,255,0));}
.nav-chev{flex:none;display:none;width:28px;height:28px;margin:0 6px;
  align-items:center;justify-content:center;background:var(--paper);border:1px solid var(--line2);border-radius:50%;font-size:14px;color:var(--ink);}
.nav-chev-left{order:-1;}
.nav-chev-right{order:1;}
.nav-wrap.has-left .nav-fade-left,.nav-wrap.has-right .nav-fade-right{display:block;}
/* both tracks exist whenever the nav overflows; visibility is what changes as you scroll */
.nav-wrap.is-over .nav-chev{display:inline-flex;visibility:hidden;}
.nav-wrap.is-over.has-left .nav-chev-left{visibility:visible;}
.nav-wrap.is-over.has-right .nav-chev-right{visibility:visible;}
/* the fades hug the scroller, so they inset past the chevron tracks (28px + 6px margins) */
.nav-wrap.is-over .nav-fade-left{left:40px;}
.nav-wrap.is-over .nav-fade-right{right:40px;}
/* MOBILE HAS NO CHEVRONS (Oliver, 20 Aug). The reserved left track is 40px wide and, at rest,
   holds an invisible button: measured headless at 390px, that pushed the first pill to 55px
   against a 19px page margin. On touch the chevrons earn nothing anyway, because you swipe.
   Dropping them on mobile puts the first pill on the margin and gives the row 80px more space,
   with the edge fades left as the overflow affordance. The fades run to the edges here since
   there is no track to inset past. Desktop keeps the tracks and the 18 Aug no-overlay
   behaviour exactly as above. */
.frame-outer[data-device="mobile"] .nav-wrap.is-over .nav-chev{display:none;}
.frame-outer[data-device="mobile"] .nav-wrap.is-over .nav-fade-left{left:0;}
.frame-outer[data-device="mobile"] .nav-wrap.is-over .nav-fade-right{right:0;}

/* ============================================================ SECTIONS */
.sec{scroll-margin-top:70px;margin-bottom:26px;}
.subsec{scroll-margin-top:70px;margin-bottom:18px;}
.anchor-wrap{scroll-margin-top:70px;}
.sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;}
.sec-label{font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
.sec-note{font-size:12.5px;color:var(--ink2);margin-bottom:12px;}

/* ============================================================ PARTY BLOCKS
   Lifted from phase1-dining-fam-hifi.html (.unit-head / .uh-titles / .party-body /
   .party-summary / .collapse-btn) and phase3-accom-fam-hifi.html (the done check),
   translated into this file's wireframe tokens. The parties layout carries status
   structurally, which is why there is no separate ledger panel. */
/* "Same as Party 1": the Phase 1 mirroring control, reused to copy per-person extras. */
.unit-samerow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--paper);flex-wrap:wrap;}
.unit-samerow .usr-text{display:flex;flex-direction:column;gap:2px;min-width:0;}
.unit-samerow .usr-label{font-size:12px;color:var(--muted);}
.unit-samerow .usr-plan{font-size:13.5px;font-weight:700;}
.unit-samerow .usr-plan.none{font-weight:400;color:var(--muted);font-style:italic;}
.frame-outer[data-device="mobile"] .unit-samerow .btn{width:100%;}

/* ============================================================ CARDS
   Phase 2 BBW runs TWO card types for extras and this file follows it:
     1. FEATURE CARD, a photo pane beside the copy, for the premium sells. BBW uses it for
        Bottomless Brunch and the VIP Pass. Here it carries the Early Access VIP Pass.
     2. REGULAR CARD, icon-led, for everything else.
   Both share the same control bar: price and scope tag left, control right.
   Regular-card anatomy is the BBW hi-fi's: body on top, full-width control bar underneath. */
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);margin-bottom:12px;overflow:hidden;
  /* clear the sticky section nav. Without this an anchor jump or a focus() lands the top of the
     card under the nav and its first line is unreadable, which is the same class of defect as
     the sticky bar clipping the paragraph at the bottom. (20 Aug) */
  scroll-margin-top:56px;}
.card.is-added{border-color:var(--line3);box-shadow:inset 3px 0 0 var(--dark);}
/* ---- FEATURE CARD, lifted from phase2-dining-extras-bbw-lofi.html ----
   Class names are Family-neutral here because BBW's own name, `.brunch-card2`, names a
   product this journey does not sell. The layout is BBW's unchanged. The mapping is:
     .feature-card = .brunch-card2    .fc-main = .brunch-main    .fc-pad = .bm-pad
   The title sits in its own band above the split, so it spans the photo and the copy. */
.dc-head{padding:12px 14px;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  background:var(--fill2);border-bottom:1px solid var(--line);}
.ph-img{position:relative;background:repeating-linear-gradient(45deg,#ededed,#ededed 9px,#e3e3e3 9px,#e3e3e3 18px);
  border-bottom:1px solid var(--line);height:120px;display:flex;align-items:center;justify-content:center;}
.ph-img span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;
  background:rgba(255,255,255,.7);padding:2px 7px;border-radius:4px;}
.feature-card{display:flex;align-items:stretch;}
.feature-card .ph-img.square{width:210px;min-width:210px;flex:none;height:auto;border-bottom:0;border-right:1px solid var(--line);}
.fc-main{flex:1;min-width:0;display:flex;flex-direction:column;}
.fc-pad{padding:14px 14px 10px;flex:1;display:flex;flex-direction:column;gap:6px;}
.fc-pad .desc{margin:0;}
/* The added state is a ::after overlay, not the inset shadow the regular card uses. An inset
   shadow paints under the element's own children, so the photo pane and the title band would
   both cover it and the card would look unadded. Same reasoning, and the same fix, as the
   gold ring in phase3-accom-fam-hifi.html. Worth folding back: BBW's own feature cards carry
   the inset shadow and have the same latent problem. */
.card.feature{position:relative;}
.card.feature.is-added:after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--dark);z-index:2;pointer-events:none;}
.frame-outer[data-device="mobile"] .feature-card{flex-direction:column;}
.frame-outer[data-device="mobile"] .feature-card .ph-img.square{width:100%;min-width:0;height:120px;
  border-right:0;border-bottom:1px solid var(--line);}
.xcard{display:block;}
.xc-body{padding:12px 13px 10px;display:flex;flex-direction:column;gap:6px;}
.xc-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.xc-head h3{font-size:15px;}
.xc-ico{font-size:20px;line-height:1;color:var(--ink2);flex:none;}
.desc{color:var(--ink2);font-size:13px;}
.xc-body .desc{margin:0;}
.dc-incl{display:flex;flex-direction:column;gap:4px;}
.dc-incl li{position:relative;padding-left:20px;font-size:12.5px;color:var(--ink2);}
.dc-incl li:before{content:"\2713";position:absolute;left:0;top:0;font-weight:800;color:var(--ink);}
.dc-more-toggle{align-self:flex-start;background:none;border:0;border-bottom:1.5px solid var(--ink);padding:0 0 1px;font-size:13px;font-weight:600;color:var(--ink);}
.dc-more{display:none;font-size:12.5px;color:var(--ink2);line-height:1.45;}
.dc-more.open{display:block;}
.row-sub{display:block;font-size:12px;color:var(--muted);}
.cbar{border-top:1px solid var(--line);padding:10px 13px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.cbar.sm{padding:8px 12px;}
.cbar-left{display:flex;flex-direction:column;align-items:flex-start;gap:5px;}
.xc-control{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
.price{display:flex;flex-direction:column;line-height:1.25;}
.price .now{font-size:20px;font-weight:800;}
.price .pp{font-size:11px;color:var(--muted);}
.scope-tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);border:1px solid var(--line2);border-radius:20px;padding:2px 8px;background:var(--fill);}
.scope-tag .st-ico{font-size:11px;line-height:1;}
/* the all-parties note: says the rule in the place the user is standing */
.allnote{font-size:12px;color:var(--ink2);background:var(--fill);border:1px dashed var(--line2);border-radius:7px;padding:7px 9px;}
.frame-outer[data-device="mobile"] .cbar{align-items:stretch;}
.frame-outer[data-device="mobile"] .xc-control{width:100%;justify-content:space-between;}

/* ---- TOKENS as a PRICING SECTION (Oliver, 20 Aug, 17:33). Ported verbatim from
   `phase4-token-packs-preview.html`, which is where the treatment was proved. It replaces the
   "three sizes, in their units" fold from earlier today: three named tiers, each a full card
   with its own badge, price, button and "what that gets you" list, mobile first as one column
   and three columns with the middle tier lifted on the wide frame.
   The ladder is 2, 4 and 6 tokens per chargeable guest, so a tier means the same thing whatever
   the party size. Superseded from the earlier fold: the "each"-labelled rows, the single Best
   rate flag, the demoted bar stepper, and the percentage saving line. The guide paragraph and
   the band nudge are back, both from the preview.
   Kept from this file rather than the preview: `scroll-margin-top` on `.card`, and the modal's
   `inert` handling, which the preview does not do. ---- */
/* ============================================================ TOKEN PACKS as a pricing section
   Mobile first: one card per row, full width. Desktop: three columns, the guide pack lifted.
   The escalation is carried by the badge (quarter, half, full) as well as the price, so the
   ladder reads without relying on the copy. */
.pk-grid{display:flex;flex-direction:column;gap:10px;}
.pk{display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:var(--radius);
  background:var(--paper);text-align:left;overflow:hidden;}
/* THE HEADER BAND (hi-fi, 27 Aug): dots, the count, and the per-guest slice right-aligned.
   The hi-fi colours the three bands blue, teal and orange; the lo-fi steps a grey per tier. */
.pk-band{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line2);}
.pk-band-0{background:#ececec;}
.pk-band-1{background:#e0e0e0;}
.pk-band-2{background:#d2d2d2;}
.pk-dots{font-size:17px;line-height:1;color:var(--ink);}
.pk-bandn{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink);}
.pk-bandn b{font-size:19px;font-weight:800;letter-spacing:0;}
.pk-each{margin-left:auto;font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:var(--ink2);}
.pk-body{display:flex;flex-direction:column;gap:8px;padding:13px;flex:1;}
/* the earned chip beside the price, on the ladder's best rate only */
.pk-best{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  border-radius:999px;padding:2px 9px;background:var(--dark);color:#fff;}
.pk.is-hero{background:var(--fill);border-color:var(--line3);}
.pk.is-hero .pk-btn{border-color:var(--dark);border-width:2px;}
/* the Recommended tag reads as promoted rather than neutral, so it is filled where the earned
   "Best rate" chip stays an outline */
.pk-chip.is-rec{background:var(--dark);border-color:var(--dark);color:#fff;}
.pk.is-on{box-shadow:inset 3px 0 0 var(--dark);border-color:var(--dark);}
.pk-badge{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line3);background:var(--paper);
  display:inline-flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink);flex:none;}
.pk-titles{display:flex;flex-direction:column;gap:2px;}
.pk-kicker{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
.pk-name{font-size:17px;}
.pk-chip{align-self:flex-start;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  border:1px solid var(--line2);border-radius:999px;padding:2px 8px;background:var(--paper);color:var(--ink2);}
.pk-chip.is-empty{visibility:hidden;}
.frame-outer[data-device="mobile"] .pk-chip.is-empty{display:none;}
.pk-copy{font-size:12.5px;color:var(--ink2);}
/* desktop only: reserve three lines of copy so the prices share a baseline, the way a pricing
   table has to. On mobile the cards stack, so there is nothing to align against. */
.frame-outer[data-device="desktop"] .pk-copy{min-height:3.2em;}
.frame-outer[data-device="desktop"] .pk-btn{margin-bottom:2px;}
.pk-money{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.pk-cost{font-size:26px;font-weight:800;line-height:1.05;}
.pk-rate{font-size:12px;color:var(--muted);}
.pk-btn{width:100%;border:1.5px solid var(--line3);border-radius:8px;background:var(--paper);
  padding:9px 12px;font-size:13.5px;font-weight:700;color:var(--ink);}
.pk-btn:hover{background:var(--fill2);}
.pk.is-on .pk-btn{background:var(--dark);color:#fff;border-color:var(--dark);}
.pk-inclhd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
.pk-incl{display:flex;flex-direction:column;gap:5px;}
.pk-incl li{position:relative;padding-left:18px;font-size:12.5px;color:var(--ink2);}
.pk-incl li:before{content:"\2713";position:absolute;left:0;top:0;font-weight:800;color:var(--ink);}
.frame-outer[data-device="desktop"] .pk-grid{flex-direction:row;align-items:stretch;}
.frame-outer[data-device="desktop"] .pk{flex:1;}
.frame-outer[data-device="desktop"] .pk.is-hero{margin-top:-6px;margin-bottom:-6px;padding-top:19px;padding-bottom:19px;}
/* the block is a plain column now: the three packs and the own-number line sit straight on the
   section, with no card around them. */
.tok-block{display:flex;flex-direction:column;gap:12px;}
/* the custom amount, as a card above the packs. It carries the SAME ANATOMY as every other card
   on this screen (Oliver, 21 Aug): body on top, then a .cbar footer with the price on the left
   at the shared .co-price size and the control on the right. It used to be one flat row with the
   price right-aligned at 17px and, on mobile, a stepper stretched to the full width by
   `flex:1 0 100%`. No bullets and no commit button: it is already on the booking, and the
   stepper is here so it can be amended without reopening the modal. */
.tok-own{border:1px solid var(--dark);border-radius:var(--radius);background:var(--fill);
  box-shadow:inset 3px 0 0 var(--dark);}
.to-body{display:flex;flex-direction:column;gap:1px;padding:10px 13px;}
.to-kicker{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
/* THE COUNT IS NOT REPEATED HERE (Oliver, 21 Aug): the stepper in the footer is showing it.
   What goes in its place is the one fact a custom amount has nowhere else to learn. Each PACK
   prints its own rate, so a pack can be compared at a glance; a number typed between bands
   cannot, and it can sit one token under a cliff where buying MORE costs LESS in total. That is
   the band cliff the harness has always insisted the screen must state rather than let the
   guest walk into. At the top band there is nothing to reach for, so it says so instead. */
.to-note{font-size:12.5px;color:var(--ink);}
.to-note b{font-weight:800;}
.to-note.is-best{color:var(--muted);}
.pk-onchip{align-self:flex-start;font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;border-radius:999px;padding:2px 9px;background:var(--dark);color:#fff;}

/* ---- B13 (25 Aug): the hero and its pills, and the always-visible custom row. ---- */
/* FULL BLEED, FLUSH TO THE ANCHOR BAR (Oliver, 25 Aug). The hero sits ABOVE the section
   heading now, edge to edge: the -18px sides eat .body's padding and the -18px top eats
   .nav-wrap's margin, so the image touches the bar. No border, no radius: a full-bleed image
   owns its edges. position:relative so the carousel arrows anchor to it. */
/* THE SECTION IS THE PHOTO (Oliver, 27 Aug round 2): one STATIC image behind the whole
   section - a flat light grey stands in for it, no hatch - full bleed, with the heading, body
   copy and costs link straight on it and one static pill top-right. The carousel, its arrows
   and its count are gone from this section; the slim card keeps its own. */
.tok-photo{position:relative;background:#e7e7e7;margin:-18px -18px 26px;
  padding:20px 18px 22px;}
.tok-photo .sec-head{margin-bottom:8px;}
/* the pill states the price of a GO on the photo. Text on an image, never a control. */
.tok-photo>.tok-pill{position:absolute;top:12px;right:14px;z-index:2;max-width:45%;
  background:rgba(255,255,255,.95);border:1px solid var(--line2);border-radius:9px;
  font-size:10px;font-weight:700;color:var(--ink);padding:2px 8px;line-height:1.3;text-align:left;}
.tok-costs-row{margin-bottom:14px;}
/* desktop rhythm (Oliver, 27 Aug): 48px of photo above the heading, 48px between the costs
   link and the pack grid */
.frame-outer[data-device="desktop"] .tok-photo{padding-top:48px;}
.frame-outer[data-device="desktop"] .tok-photo .tok-costs-row{margin-bottom:48px;}
/* slim's carousel controls, mobile frame only, as before the 27 Aug round 1 detour */
.hero-arrow{display:none;position:absolute;top:50%;transform:translateY(-50%);z-index:2;
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:rgba(255,255,255,.92);
  font-size:16px;line-height:1;color:var(--ink);}
.hero-arrow[data-heroarrow="-1"]{left:8px;}
.hero-arrow[data-heroarrow="1"]{right:8px;}
.frame-outer[data-device="mobile"] .hero-arrow{display:inline-flex;align-items:center;justify-content:center;}
/* SUPERSEDED 27 Aug: .tok-ownrow and the standing typed-field card went with the hi-fi. */
/* THE CUSTOM BAR (hi-fi, 27 Aug): one full-width row under the grid, dashed and filled so it
   reads as the adjacent path rather than a fourth pack. Closed it carries the from-rate and one
   button; open it carries the draft's figures, a type-or-step control and the commit; committed
   it carries the booking's price, the amendable stepper and On your booking. */
.own-bar{display:flex;flex-direction:column;gap:12px;border:1.5px dashed var(--line3);
  border-radius:var(--radius);background:var(--fill);padding:14px;}
.own-bar.is-on{border-style:solid;border-color:var(--dark);box-shadow:inset 3px 0 0 var(--dark);}
/* ONE FIGURE SHAPE, EVERY STATE (Oliver, 27 Aug round 2): small line, then the price at ONE
   size with the rate beside it. The hi-fi holds 14/24px across both states; nothing here may
   change size when the bar opens or commits. */
.own-bar .ol-save,.own-bar .of-kick{font-size:12px;font-weight:700;color:var(--ink);
  text-transform:none;letter-spacing:0;}
.own-bar .of-kick{color:var(--ink2);}
.own-bar .pk-money{align-items:baseline;gap:6px;flex-wrap:nowrap;}
.own-bar .pk-cost{font-size:22px;}
.own-bar .pk-rate{font-size:12px;}
.own-live{display:flex;flex-direction:column;gap:3px;min-width:0;}
.own-live .to-note{font-size:11.5px;}
/* the actions slot: the control when there is one, then the button - the same slot in every
   state, so the button holds its place when the bar changes state */
.own-actions{display:flex;flex-direction:column;gap:10px;}
/* the stepper's readout is a typeable field: type or step, both, as since 24 Aug. The control
   matches the buttons' height so the row sits on one line. */
.own-ctl{display:flex;}
.own-ctl .stepper{height:44px;}
.own-ctl .stepper .own-input{width:56px;border:0;background:none;text-align:center;
  font-weight:700;font-size:14px;padding:0;}
.own-ctl .stepper .own-input:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;}
.own-bar .pk-btn{width:100%;padding:12px;}
/* DESKTOP (Oliver, 28 Aug): the figures column is PINNED. Column one is exactly a pack-card's
   width, so the figures always start on the middle card's left edge and stay there whatever
   the state renders - a from-price, a draft or the booking. The actions hug the right. */
.frame-outer[data-device="desktop"] .own-bar{display:grid;
  grid-template-columns:calc((100% - 20px)/3) minmax(0,1fr) auto;
  gap:10px;align-items:center;padding:14px 0;}
.frame-outer[data-device="desktop"] .own-bar .pk-titles{padding-left:14px;}
.frame-outer[data-device="desktop"] .own-actions{flex-direction:row;align-items:center;
  gap:12px;justify-content:flex-end;padding-right:14px;}
.frame-outer[data-device="desktop"] .own-bar .own-ctl .stepper{width:132px;justify-content:space-between;}
.frame-outer[data-device="desktop"] .own-bar .pk-btn{width:220px;flex:none;}
.tok-sub{margin-bottom:12px;}

/* ============================================================ TOKENS SLIM (27 Aug 2026)
   The Paper V2 card: the whole section in one card. Hero with a translucent Tokens pill (no
   dots; arrows are the mobile-only .hero-arrow rules above), the title and body copy inside
   the card, pack rows as radios with rate and cash saving, the custom stepper row, and the
   price in the CARD footer via the shared .cbar anatomy. Desktop is the feature-card grammar:
   image pane left at full card height, copy centred beside the rows, the bar under both. */
.slim-hero{position:relative;display:flex;}
.slim-hero .ph-img{display:none;height:150px;flex:1;border-radius:0;border-bottom:1px solid var(--line);}
.slim-hero .ph-img.is-active{display:flex;}
.slim-pill{position:absolute;left:10px;top:10px;z-index:2;display:inline-flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.78);border:1px solid var(--line2);border-radius:999px;padding:3px 10px;
  font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--ink2);backdrop-filter:blur(3px);}
.slim-main{display:flex;flex-direction:column;gap:12px;padding:14px;}
.slim-copy{display:flex;flex-direction:column;gap:6px;}
.slim-title{font-size:17px;}
.slim-copy .desc{margin:0;}
.slim-costs{margin:2px 0 0;}
.slim-rows{display:flex;flex-direction:column;gap:8px;}
.slim-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:8px;
  background:var(--paper);padding:11px 12px;width:100%;text-align:left;font-size:13.5px;color:var(--ink);
  min-height:48px;}   /* one height for packs AND the custom row (Oliver, 27 Aug) */
.slim-row.is-on{border-color:var(--dark);background:var(--fill);box-shadow:inset 0 0 0 1px var(--dark);}
.slim-row b{flex:1;font-weight:700;}
.slim-rate{font-size:12px;color:var(--ink2);text-align:right;}
.slim-dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink);flex:none;
  position:relative;background:var(--paper);}
.slim-row.is-on .slim-dot:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--dark);}
/* the custom row: the radio half is its own button so the stepper's buttons are not nested.
   NO PADDING AROUND THE STEPPER (Oliver, 27 Aug, screenshot): the stepper is a full-height
   cell block on the row's right edge, rules not borders, so the row matches the packs' 48px. */
.slim-row.is-custom{padding:0 0 0 12px;overflow:hidden;}
.slim-row.is-custom .slim-pick{align-self:stretch;padding:0;}
.slim-row.is-custom .stepper{align-self:stretch;align-items:stretch;gap:0;
  border:0;border-left:1px solid var(--line2);border-radius:0;}
.slim-row.is-custom .step-btn{height:auto;}
.slim-row.is-custom .qty{display:inline-flex;align-items:center;justify-content:center;min-width:44px;
  border-left:1px solid var(--line2);border-right:1px solid var(--line2);}
.slim-pick{display:flex;align-items:center;gap:10px;flex:1;background:none;border:0;padding:5px 0;
  text-align:left;font-size:13.5px;color:var(--ink);}
.slim-pick b{font-weight:700;}
/* the card footer: price row first, the saving line in demi under it (Oliver's Paper layout) */
.slim-bar .co-priceblock{gap:2px;}
.slim-money{display:flex;align-items:baseline;gap:7px;}
.slim-save{font-size:11.5px;font-weight:700;color:var(--ink);}
.slim-save.is-none{color:var(--muted);font-weight:600;}
/* 210px image pane, matching .feature-card's .ph-img.square, so this card and the feature
   cards below share one photo width (Oliver, 27 Aug — 380px read too big). */
.frame-outer[data-device="desktop"] .slim-card{display:grid;grid-template-columns:210px minmax(0,1fr);}
.frame-outer[data-device="desktop"] .slim-hero{grid-row:1/3;border-right:1px solid var(--line);}
.frame-outer[data-device="desktop"] .slim-hero .ph-img{height:100%;border-bottom:0;}
/* the carousel arrows run on desktop too here (Oliver, 27 Aug); .hero-arrow is otherwise
   mobile-only. Sized down to suit the 210px pane. */
.frame-outer[data-device="desktop"] .slim-hero .hero-arrow{display:inline-flex;align-items:center;
  justify-content:center;width:28px;height:28px;font-size:14px;}
.frame-outer[data-device="desktop"] .slim-main{grid-column:2;display:grid;
  grid-template-columns:minmax(240px,1fr) minmax(0,1.25fr);gap:16px 28px;align-items:center;padding:18px;}
.frame-outer[data-device="desktop"] .slim-bar{grid-column:2;}

/* the section's own furniture, below the packs */
.tok-guide{font-size:12.5px;color:var(--ink2);}
.tok-nudge{font-size:12.5px;color:var(--ink);background:var(--fill);border:1px dashed var(--line3);
  border-radius:7px;padding:8px 10px;}
.tok-note{font-size:11.5px;color:var(--muted);}
.tok-custom{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;
  border-top:1px solid var(--line);padding-top:10px;}
.tok-more{align-self:flex-start;background:none;border:0;border-bottom:1.5px solid var(--ink);
  padding:0 0 1px;font-size:13px;font-weight:600;color:var(--ink);}
.tok-costs-link{align-self:flex-start;}
/* the tokens intro: copy, then the activity costs link, held to half the frame on desktop */
.tok-intro{margin-bottom:12px;}
.tok-intro .sec-note{margin-bottom:8px;}
.frame-outer[data-device="desktop"] .tok-intro{max-width:50%;}
/* ============================================================ V2: THE VALUE ARGUMENT
   Added 24 Aug 2026 after the client call. Three beats above the packs: why buying now is worth
   it, what you are NOT committing to, and when the booking actually happens. These are
   STRUCTURE rather than a sentence in the intro because the client's problem is that the
   argument was never made, not that it was made badly. */
/* NO BOX (Oliver, 24 Aug). It was a bordered grey card, which put the explainer at the same
   visual weight as the three packs underneath it and made the top of the step read as four
   cards rather than an argument followed by a choice. On the page background it reads as page
   furniture and the packs are the only cards in the section, which is the point of them. */
.tok-how{margin-bottom:14px;}
.th-steps{display:flex;flex-direction:column;gap:10px;margin:0 0 10px;padding:0;list-style:none;}
/* the number spans both text rows, so the title and the detail sit against one marker rather
   than the detail wrapping back under it */
.th-step{display:grid;grid-template-columns:24px 1fr;gap:2px 10px;align-items:start;}
.th-num{grid-row:1 / span 2;width:24px;height:24px;border-radius:50%;background:var(--dark);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.th-t{font-size:13.5px;font-weight:800;}
.th-d{font-size:12.5px;color:var(--ink2);}
.th-d b{font-weight:800;color:var(--ink);}
.frame-outer[data-device="desktop"] .th-steps{flex-direction:row;}
.frame-outer[data-device="desktop"] .th-step{flex:1;}
/* the intro and its activity costs link move INSIDE this block, under a rule. The half-width
   hold was there to stop one measure of body text running across 1080px; inside a bordered
   block with three columns above it there is nothing left to hold back. */
.tok-how .tok-intro{margin-bottom:0;border-top:1px solid var(--line);padding-top:10px;}
.frame-outer[data-device="desktop"] .tok-how .tok-intro{max-width:none;}

/* the saving row on a pack. CASH against a stated resort price, never a percentage: see the
   note on RESORT_RATE. The resort figure is struck, which is the only place on this screen a
   was-price appears, so it carries the comparison without a word of explanation. */
/* one line since the hi-fi port (27 Aug): "Save £x.xx on resort prices" */
.pk-save{display:flex;align-items:baseline;gap:5px;font-size:12px;color:var(--ink2);
  border-top:1px dashed var(--line2);border-bottom:1px dashed var(--line2);padding:7px 0;}
.pk-was{font-size:11.5px;color:var(--muted);}
.pk-off{font-size:13.5px;font-weight:800;}
.pk-save.is-none{font-size:11.5px;color:var(--muted);gap:4px;}
/* the flagged-figure chip. tkMark() has existed since 20 Aug with nothing styling it, because
   nothing had used it; the on resort rate is the first figure on this screen that needs it. */
.tok-tk{display:inline-block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  border:1px dashed var(--line3);border-radius:4px;padding:1px 5px;color:var(--ink2);background:var(--paper);}
.tok-basis{margin-top:10px;}
/* said once more directly under the commit buttons. Beat 2 says it at the top of the section,
   but on a phone three stacked packs push that a screen and a half away, and this is the exact
   confusion the client asked us to design out. */
.tok-noboo{font-size:12px;color:var(--ink2);}

/* ---- V2: THE CUSTOM CHOOSER, back on the block. Type a number or step to it. ---- */
.tok-ownwrap{display:flex;flex-direction:column;gap:10px;align-items:flex-start;}
.own-panel{width:100%;border:1px solid var(--line2);border-radius:var(--radius);background:var(--paper);
  padding:12px;display:flex;flex-direction:column;gap:10px;}
.own-panel[hidden]{display:none;}   /* display:flex would otherwise beat the hidden attribute */
.own-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.own-lab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
/* the field lives INSIDE the stepper shell, so the shell draws the border and the field only
   draws the two rules that separate it from the buttons. */
.own-step{align-items:stretch;}
.own-input{width:66px;height:44px;padding:0 6px;font:inherit;font-size:15px;font-weight:700;
  color:var(--ink);text-align:center;background:var(--paper);
  border:0;border-left:1px solid var(--line2);border-right:1px solid var(--line2);border-radius:0;}
/* the spinners would sit next to the minus and plus doing the same job in a smaller target */
.own-input::-webkit-outer-spin-button,.own-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.own-input[type=number]{-moz-appearance:textfield;appearance:textfield;}
.own-live{display:flex;flex-direction:column;gap:2px;}
.ol-cost{font-size:19px;font-weight:800;}
.ol-rate,.ol-save{font-size:12px;color:var(--ink2);}
.ol-save.is-none,.ol-none{font-size:12px;color:var(--muted);}
.own-panel .to-note{font-size:12px;}
.own-add[aria-disabled="true"]{opacity:.45;cursor:not-allowed;}
.frame-outer[data-device="mobile"] .own-add{width:100%;}

/* ---- QUICK WINS (16 Sep 2026): the settled design ported from
   phase4-tokens-quickwins-explorations.html rounds 1-11. A split: inert photo-card guide in
   the page flow (paged, never scrolling in its own box), one buy panel holding the only
   purchase control. Nothing sticky. qw- prefix throughout so nothing collides. ---- */
.qw-split{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);}
.frame-outer[data-device="desktop"] .qw-split{grid-template-columns:minmax(0,1fr) 300px;align-items:start;}
.frame-outer[data-device="mobile"] .qw-split .qw-panel{order:-1;}   /* buy leads on the phone */
.qw-pane{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:10px 12px 8px;}
.qw-panel{border:1px solid var(--line2);border-radius:10px;background:var(--paper);padding:12px 14px;}
.frame-outer[data-device="desktop"] .qw-panel{position:sticky;top:10px;}  /* a sidebar holding still, not a footer */
/* titles: 15px ink leads both boxes; the pane's drops to label rank on mobile (round 11) */
.qw-bh{font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--ink);margin:0 0 10px;}
.qw-pane .qw-bh{margin:0 0 4px;}
.frame-outer[data-device="mobile"] .qw-pane .qw-bh{font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted);margin:0 0 8px;}
.qw-bsub{font-size:12px;color:var(--ink2);line-height:1.45;margin:0 0 12px;max-width:560px;}
.qw-lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;}
/* the one amount control: a full-width typed field, "tokens" suffixed inside it (round 5) */
.qw-field{display:flex;align-items:center;border:1px solid var(--line2);border-radius:7px;
  background:var(--paper);padding:0 10px;margin:0 0 10px;}
.qw-field input{flex:1;min-width:0;border:0;background:none;padding:9px 0;outline:none;
  font-family:inherit;font-size:13px;font-weight:800;color:var(--ink);}
.qw-field .sfx{font-size:12px;color:var(--muted);font-weight:600;padding-left:8px;flex:none;}
.qw-field:focus-within{outline:2px solid var(--ink);outline-offset:2px;}
.qw-save{font-size:12px;color:var(--ink2);margin:2px 0 0;}
.qw-save b{font-size:12.5px;}
/* the band ladder, hairlined into its own block (round 9); current cell outlined, never
   dark-filled - dark fill is this file's added state (round 11) */
.qw-ratebox{border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:10px 0 12px;margin:12px 0 0;}
.qw-ratebox .qw-lbl{margin:0 0 8px;}
.qw-rbar{display:flex;gap:2px;margin:0 0 2px;}
.qw-rseg{flex:1;height:26px;background:var(--fill);border:1px solid var(--line);border-radius:3px;
  display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--muted);
  white-space:nowrap;overflow:hidden;}
.qw-rseg.done{background:var(--fill3);color:var(--ink2);}
.qw-rseg.cur{background:var(--paper);border:2px solid var(--ink);color:var(--ink);}
.qw-rlegend{display:flex;gap:2px;}
.qw-rlegend span{flex:1;text-align:center;font-size:8.5px;color:var(--muted);}
/* price beside the add button (round 7), the rate stacked under it so nothing wraps at 300px */
.qw-pacts{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;}
.qw-pn{font-size:17px;font-weight:800;min-width:0;}
.qw-pn .qw-rate{display:block;font-size:11px;font-weight:600;color:var(--muted);}
.qw-pacts .btn-add{flex:none;}
.qw-onbk{font-size:12px;color:var(--ink2);border-top:1px dashed var(--line);margin-top:10px;padding-top:8px;
  display:flex;align-items:center;gap:10px;}
.qw-onbk b{font-size:12.5px;}
.qw-onbk .tok-more{margin-left:auto;}   /* Remove sits right, on the same line */
/* the guide: inert photo cards, two-up mobile, three-up desktop, each with two icon-led fact
   rows (round 8). The tok-more link idiom carries the remove affordance in the onbk row. */
.qw-grid{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr));}
.frame-outer[data-device="desktop"] .qw-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
.qw-card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper);
  display:flex;flex-direction:column;}
.qw-card .ph-img{height:84px;border-bottom:1px solid var(--line);}
.frame-outer[data-device="desktop"] .qw-card .ph-img{height:104px;}
.qw-card .bd{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1;}
.qw-card .nm{font-size:12.5px;font-weight:800;line-height:1.25;}
.qw-card .mrow{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);line-height:1.3;}
.qw-card .mrow svg{width:13px;height:13px;flex:none;color:var(--line3);}
.qw-panefoot{display:flex;justify-content:center;padding:10px 0 4px;}
.qw-more{background:var(--paper);border:1px solid var(--line2);border-radius:8px;
  padding:9px 14px;font-size:13px;font-weight:700;color:var(--ink);}
.qw-more:hover{background:var(--fill);}

/* ---- MODAL. Activity costs is reference content, so it overlays rather than lengthening the
   section. Bottom sheet on a phone, centred dialog on desktop, both inside the device frame. ---- */
.modal-back{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.45);
  display:flex;align-items:flex-end;justify-content:center;}
.frame-outer[data-device="desktop"] .modal-back{align-items:center;}
.modal{background:var(--paper);border:1px solid var(--line2);border-radius:12px 12px 0 0;
  width:100%;max-height:84%;display:flex;flex-direction:column;overflow:hidden;}
.frame-outer[data-device="mobile"] .modal{max-height:88%;}
/* the drawer slides (Oliver, 21 Aug). The out state needs the element to stay mounted while it
   plays, so closeTokModal() sets .is-closing, waits for the animation, then re-renders. */
@keyframes drawerIn{from{transform:translateY(100%);}to{transform:translateY(0);}}
@keyframes drawerOut{from{transform:translateY(0);}to{transform:translateY(100%);}}
@keyframes scrimIn{from{opacity:0;}to{opacity:1;}}
.modal-back{animation:scrimIn .2s ease;}
.modal-back.is-closing{animation:scrimIn .18s ease reverse forwards;}
.frame-outer[data-device="mobile"] .modal{animation:drawerIn .24s cubic-bezier(.2,.8,.2,1);}
.frame-outer[data-device="mobile"] .modal.is-closing{animation:drawerOut .2s ease-in forwards;}
@media (prefers-reduced-motion: reduce){
  .modal-back,.modal-back.is-closing,
  .frame-outer[data-device="mobile"] .modal,
  .frame-outer[data-device="mobile"] .modal.is-closing{animation:none;}
}
.frame-outer[data-device="desktop"] .modal{border-radius:12px;max-width:560px;max-height:80%;}
.modal-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);}
.modal-head h3{font-size:15.5px;flex:1;}
.modal-x{width:30px;height:30px;flex:none;border:1px solid var(--line2);border-radius:50%;
  background:var(--paper);font-size:15px;line-height:1;color:var(--ink);}
.modal-body{padding:12px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;
  flex:1;min-height:0;}   /* min-height:0 is what lets a flex child actually scroll */
.modal-intro{font-size:12.5px;color:var(--ink2);line-height:1.5;}
.modal-intro b{color:var(--ink);}
/* the lede sits between the head and the filters, so it stays put while the list scrolls */
.modal-lede{padding:10px 14px;display:flex;flex-direction:column;gap:6px;flex:none;}
/* filters. One row under the head, so they stay put while the list scrolls. */
.modal-filters{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);
  background:var(--fill);flex:none;}
.fchip{background:var(--paper);border:1px solid var(--line2);border-radius:999px;padding:5px 12px;
  font-size:12px;font-weight:600;color:var(--ink2);}
.fchip:hover{background:var(--fill2);}
.fchip[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:#fff;}
/* SUPERSEDED 27 Aug: the dialog footer is gone. The cross in the head closes it, and the
   "not a booking" sentence leads the dialog above the filters, so .modal-foot and the .mf-*
   rules went with it. */
.scroll.is-locked{overflow:hidden;}
.tok-vh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink);
  padding-bottom:6px;border-bottom:1px solid var(--line2);}
.tok-vh span{float:right;font-weight:600;color:var(--muted);letter-spacing:0;}
.tok-acts{display:flex;flex-direction:column;}
/* three levels a row: the name, then who it suits and what a go covers, then the token cost.
   It was one flat line of 12px text for everything, which is why it read as a wall. */
/* the whole row is a tap target since 21 Aug, so the grid moves onto the button and the list
   item is just the divider. */
.ta-row{border-bottom:1px solid var(--line);}
.ta-row:last-child{border-bottom:0;}
/* THE TAP TARGET FILLS THE ROW EXACTLY. Two wrong turns worth recording: width:100% with
   margin:0 -6px pinned the width and then shifted it left, so it ended 6px short on the right;
   dropping width:100% was worse, because a <button> sizes to fit-content even as a grid, so it
   collapsed to 217px. width:100% with no horizontal margin or padding is the stable answer, and
   it puts the + flush with the end of the divider. */
.ta-tap{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;
  background:none;border:0;padding:9px 0;text-align:left;font:inherit;color:inherit;}
/* PRESS, not hover, is the state that matters here (Oliver, 21 Aug), and it is carried by the
   round button alone: flashing the whole row is heavy on a list built for repeated tapping.
   The browser's own tap highlight is suppressed for the same reason. */
.ta-tap{-webkit-tap-highlight-color:transparent;}
.ta-tap:active .ta-plus{background:var(--dark);border-color:var(--dark);color:#fff;}
.ta-tap[aria-disabled="true"]{opacity:.45;cursor:not-allowed;}
.ta-tap[aria-disabled="true"]:active .ta-plus{background:none;border-color:var(--line2);color:var(--ink);}
.ta-right{display:flex;align-items:center;gap:8px;}
.ta-plus{width:24px;height:24px;flex:none;border:1px solid var(--line2);border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;font-size:15px;line-height:1;color:var(--ink);}
/* HOVER ONLY WHERE THERE IS A POINTER, and only in the wide frame. A phone has no hover, and
   the device here is a toolbar toggle rather than a real viewport, so the media query alone
   would not honour it. Kept visibly distinct from the press state: hover darkens the ring and
   tints the row, press fills the ring. */
@media (hover:hover) and (pointer:fine){
  .frame-outer[data-device="desktop"] .ta-tap:hover{background:var(--fill);}
  .frame-outer[data-device="desktop"] .ta-tap:hover .ta-plus{border-color:var(--ink);}
  .frame-outer[data-device="desktop"] .ta-tap[aria-disabled="true"]:hover{background:none;}
  .frame-outer[data-device="desktop"] .ta-tap[aria-disabled="true"]:hover .ta-plus{border-color:var(--line2);}
}
/* V2: THE ROW IS A LINE OF REFERENCE, NOT A CONTROL (client, 24 Aug). Tap-to-add is gone, so
   the grid moves off a <button> and onto a plain div. Everything the tap state needed - the
   press fill, the hover tint, the disabled-at-cap handling, the round plus - went with it. */
.ta-line{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:9px 0;}
.ta-main{display:flex;flex-direction:column;gap:1px;min-width:0;}
.ta-name{font-size:15px;font-weight:700;color:var(--ink);}
.ta-meta{font-size:11.5px;color:var(--muted);}
/* the token count is the smallest thing in the row: this is a reference list, not a price list */
.ta-cost{font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap;text-align:right;}
/* ---- check-in pair: one card, two options, per BBW ---- */
.checkin-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.checkin-opts.one{grid-template-columns:1fr;}
.checkin-opt{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper);}
.checkin-opt.is-added{border-color:var(--line3);box-shadow:inset 3px 0 0 var(--dark);}
.co-info{padding:10px 12px 8px;}
.co-info b{font-size:13.5px;}
.co-priceblock{display:flex;flex-direction:column;line-height:1.2;}
.co-price{font-size:16px;font-weight:800;}
.co-pp{font-size:11px;color:var(--muted);}
.frame-outer[data-device="mobile"] .checkin-opts{grid-template-columns:1fr;}

/* ---- buttons and controls ---- */
.btn{background:var(--paper);border:1px solid var(--line2);border-radius:8px;padding:8px 13px;font-size:13px;font-weight:600;color:var(--ink);}
.btn:hover{background:var(--fill);}
.btn.ghost{background:none;border-color:var(--line2);color:var(--ink2);}
.btn.sm{padding:5px 9px;font-size:12px;}
.btn.primary{background:var(--dark);color:#fff;border-color:var(--dark);}
.btn-add{background:var(--paper);border:1.5px dashed var(--line3);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;}
.btn-add:hover{background:var(--fill);}
.btn-add.is-added{background:var(--dark);color:#fff;border:1.5px solid var(--dark);}
.btn-add .tick{font-weight:800;}
.btn-add[aria-disabled="true"]{opacity:.45;cursor:not-allowed;border-style:solid;}
.stepper{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line2);border-radius:8px;overflow:hidden;}
.step-btn{width:44px;height:44px;border:0;background:var(--paper);font-size:18px;line-height:1;color:var(--ink);}
.step-btn:hover{background:var(--fill);}
.step-btn[aria-disabled="true"]{opacity:.4;cursor:not-allowed;}
.qty{min-width:34px;text-align:center;font-weight:700;font-size:14px;}

/* ---- callouts ---- */
.callout{display:flex;align-items:center;gap:12px;border:1px solid var(--line2);border-left:4px solid var(--dark);
  border-radius:8px;background:var(--fill);padding:11px 13px;margin-bottom:12px;}
.callout b{font-size:14px;}
.callout-sub{display:block;font-size:12px;color:var(--ink2);}
.callout .btn{margin-left:auto;}
.frame-outer[data-device="mobile"] .callout{flex-wrap:wrap;}
.frame-outer[data-device="mobile"] .callout .btn{width:100%;margin-left:0;}

/* ============================================================ OVERVIEW */
.ov-block{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);padding:13px;margin-bottom:12px;}
.ov-head{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;margin-bottom:8px;}
.ov-head .ov-sub{font-weight:500;font-size:12px;color:var(--muted);}
.ov-head .btn{margin-left:auto;}
.ovsum-toggle{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font:inherit;font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);}
.ovsum-toggle .chev{margin-left:auto;color:var(--muted);font-size:14px;}
.ov-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;}
.ov-row:first-child{border-top:0;}
.ov-row.muted{color:var(--muted);}
.ov-price{margin-left:auto;text-align:right;display:flex;flex-direction:column;line-height:1.2;}
.ov-price .pp{font-size:11px;color:var(--muted);}
.incl-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;}
.incl-row:first-child{border-top:0;}
.incl-text{display:flex;flex-direction:column;gap:2px;}
.incl-text span{font-size:12px;color:var(--ink2);}
.inc-tag{margin-left:auto;flex:none;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);border:1px solid var(--line2);border-radius:20px;padding:2px 8px;background:var(--fill);}
.ov-changelink{display:inline-block;margin-top:10px;background:none;border:0;padding:0;color:var(--ink2);text-decoration:underline;font-size:12.5px;}
/* grouped breakdown: bdRow from phase2-dining-extras-bbw-hifi.html. Parallel left/right
   stacks so the indented sub-lines line up with their values. */
.bd-list{display:flex;flex-direction:column;}
.bd-row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-top:1px solid var(--line2);}
.bd-row:first-child{border-top:0;}
.bd-l,.bd-r{display:flex;flex-direction:column;gap:3px;min-width:0;}
.bd-r{text-align:right;flex:none;}
.bd-main{font-size:13.5px;font-weight:700;}
.bd-sub{font-size:12px;color:var(--ink2);font-weight:400;}
/* the sub-lines are indented under their group label, which is what makes them read as
   belonging to it rather than as siblings. Left stack only: the right stack stays flush so
   the values keep a single alignment down the column. */
.bd-l .bd-sub{padding-left:12px;}
.bd-row.muted .bd-main{font-weight:400;color:var(--muted);}
.bd-row.savings .bd-main{color:var(--ink);}
.bd-row.total{border-top:2px solid var(--line3);margin-top:4px;padding-top:10px;}
.bd-row.total .bd-main{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;}
.sum-addlink{background:none;border:0;padding:0;color:var(--ink);font-weight:600;font-size:13px;text-decoration:underline;}

/* ============================================================ FOOTER
   MATCHED TO THE LIVE BUTLIN'S ACTION BAR (Oliver, 20 Aug: "match what they have now, there's
   no scope in this project to improve it"). This reverses the call previously recorded here,
   which read "Not BBW's floating price tab" on the grounds that Family used the inline total
   from phase1-dining-fam-lofi.html. The live Family footer IS the tab, so the Family shell was
   the divergence. Layout and greyscale lift from phase2-dining-extras-bbw-lofi.html, whose own
   comment already says it mirrors the live site, and the copy string matches it byte for byte.
   Live carries no summary control in the footer, so it has gone. The grouped breakdown is not
   lost with it: breakdownRows() also renders into the Your booking section.

   SOURCE OF TRUTH, 21 Aug: "Screenshots for Idealize/btl_chrome_mobile.heic" and
   ".../btl_chrome_desktop.heic". Both frames carry the price tab and the SAVE QUOTE / CONTINUE
   pair; desktop also carries the one line of copy, mobile does not (Oliver, 21 Aug). Colour is
   the one deliberate departure: live prints the total in Butlin's red, this file is greyscale
   by the wireframe-tokens rule at the top. Layout, not palette, is what these screenshots
   settle. Do not change this footer without Oliver asking. */
.footer{position:relative;z-index:6;}
/* the price is a tab that pokes up above the bar, over the page content, so the footer only
   reserves the bar height and there is no empty white row beside it */
.fprice{position:absolute;right:0;bottom:100%;display:flex;align-items:baseline;gap:8px;
  background:var(--fill2);border:1px solid var(--line);border-bottom:0;
  border-top-left-radius:8px;border-top-right-radius:8px;padding:8px 18px;}
.fprice-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);}
.fprice b{font-size:20px;color:var(--ink);}
.fbar{width:100%;display:flex;align-items:center;gap:16px;border-top:1px solid var(--line2);padding:12px 18px;background:var(--paper);}
.finstruct{flex:1;font-size:13px;color:var(--ink2);min-width:0;}
.factions{display:flex;gap:10px;margin-left:auto;}
.savebtn{background:var(--paper);border:1px solid var(--ink);border-radius:6px;padding:12px 20px;font-weight:700;font-size:13px;color:var(--ink);text-transform:uppercase;letter-spacing:.04em;}
.savebtn:hover{background:var(--fill);}
.continue{background:var(--dark);color:#fff;border:1px solid var(--dark);border-radius:6px;padding:12px 22px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;}
/* MOBILE: THE PRICE TAB PLUS THE TWO BUTTONS. Settled by Oliver, 21 Aug, against the browser
   captures now in "Screenshots for Idealize" (btl_chrome_mobile, 744x1330 @2x = 372 CSS px,
   and btl_chrome_desktop, 3020x1714 @2x = 1510 CSS px). Those two screenshots are the footer.
   Do not deviate from them without Oliver saying so.
   This closes the contested call recorded here on 20 Aug ("the copy and the price tab are
   desktop-only", read off Booking-Overview-08-19-2026). Half of it was wrong: the tab IS on
   mobile, so there is a running total while you scroll. The copy is not, and Oliver asked for
   it out explicitly, so .finstruct stays hidden.
   Measured off btl_chrome_mobile: tab 50px tall, bottom edge flush with the bar top, left edge
   ~104px in and the right edge running off the screen - so the top-right radius goes, because
   live shows no corner there. The price keeps its desktop size: live does not shrink it, and
   the tab still clears the frame at 390px. Buttons stay content-sized and centred as a pair,
   NOT stretched to half the bar each (a first pass used flex:1 and the check caught it). */
.frame-outer[data-device="mobile"] .fbar{flex-wrap:wrap;gap:10px;padding:12px;}
.frame-outer[data-device="mobile"] .fprice{padding:7px 16px;border-top-right-radius:0;border-right:0;}
.frame-outer[data-device="mobile"] .finstruct{display:none;}
.frame-outer[data-device="mobile"] .factions{width:100%;margin-left:0;gap:10px;justify-content:center;}
</style>
</head>
<body>
<div class="stage">

  <!-- DEV TOOLBAR -->
  <!-- Defaults are mobile, Bognor Regis, single party (user, 20 Aug). Mobile because the client
       is mobile-first and that is the frame the work should be judged in. Bognor because it
       carries the most sections, so the busiest state is the one you land on. -->
  <div class="toolbar" id="rootToggleHost" data-device="mobile">
    <span class="tlabel">Phase 4 &middot; Family Extras</span>
    <div class="seg-group"><span class="gl">Booking</span>
      <div class="seg" role="group" aria-label="Booking shape"><button id="bkP1" aria-pressed="true">1 party of 4</button><button id="bkP2" aria-pressed="false">2 parties, 2+8</button></div>
    </div>
    <div class="seg-group"><span class="gl">Resort</span>
      <div class="seg" role="group" aria-label="Resort"><button id="rsBognor" aria-pressed="true">Bognor Regis</button><button id="rsMine" aria-pressed="false">Minehead</button></div>
    </div>
    <div class="seg-group"><span class="gl">Break</span>
      <div class="seg" role="group" aria-label="Break type"><button id="brTerm" aria-pressed="true">Term time</button><button id="brSummer" aria-pressed="false">Summer hols</button></div>
    </div>
    <!-- V2 ONLY. Which tokens approach the step renders. Bognor only, so at Minehead the
         control is still live but the section it governs is absent (tokensActive()). -->
    <div class="seg-group"><span class="gl">Tokens</span>
      <!-- "Tokens Slim" (27 Aug): the Paper V2 single-card design, chosen on the 27 Aug review.
           "Tokens Large" is the pack grid that was labelled "Token packs"; "Quick Wins" is the
           branch that was "Current + quick wins". Ids are unchanged so the wiring and the
           harness keep their handles. -->
      <div class="seg" role="group" aria-label="Tokens approach"><button id="tkSlim" aria-pressed="false">Tokens Slim</button><button id="tkPacks" aria-pressed="true">Tokens Large</button><button id="tkCurrent" aria-pressed="false">Quick Wins</button></div>
    </div>
    <!-- everything that changes the BOOKING sits left; the device toggle is a viewing control,
         not part of the scenario, so it stands alone on the right (user, 20 Aug) -->
    <div class="right">
      <div class="seg" role="group" aria-label="Device"><button id="dvMobile" aria-pressed="true">Mobile</button><button id="dvDesktop" aria-pressed="false">Desktop</button></div>
    </div>
  </div>

  <!-- DEVICE FRAME -->
  <div class="frame-outer" id="deviceHost" data-device="mobile">
    <div class="frame">

      <div class="scroll" id="scroll">

        <div class="appbar">
          <span class="ico" aria-hidden="true">&#9776;</span>
          <span class="brand">Butlin's<small>90 YEARS</small></span>
          <span class="icons" aria-hidden="true"><span class="ico">&#128100;</span><span class="ico">?</span><span class="ico">&#8942;</span></span>
        </div>

        <div class="chrome-mid">
          <p class="step-title">Step 3 of 6: Extras &amp; Passes</p>
          <div class="step-row">
            <a href="#" class="backlink" onclick="return false;">&lsaquo; Back</a>
            <div class="dots" role="list" aria-label="Booking progress, step 3 of 6">
              <span class="dotstep done" role="listitem" aria-label="Step 1, complete"><span aria-hidden="true">&#10003;</span></span>
              <span class="dotstep done" role="listitem" aria-label="Step 2, complete"><span aria-hidden="true">&#10003;</span></span>
              <span class="dotstep current" role="listitem" aria-current="step" aria-label="Step 3, current"></span>
              <span class="dotstep" role="listitem" aria-label="Step 4"></span>
              <span class="dotstep" role="listitem" aria-label="Step 5"></span>
              <span class="dotstep" role="listitem" aria-label="Step 6"></span>
            </div>
          </div>
          <div class="searchsum">
            <span class="summ"><b id="resortSumm">Minehead</b> | 20 to 24 Jul 2026 (4 nights) | <b id="guestSumm">4 guests</b></span>
            <button class="editsum" onclick="return false;">Edit search</button>
          </div>
        </div>

        <div class="body">
          <!-- Heading only. The standing body copy was removed (user, 19 Aug): it restated
               what the cards and the footer note already say, and on mobile it pushed the
               first extra below the fold. P0 2a and 2c, above the fold and copy that earns
               its place. -->
          <div class="intro">
            <h1>Make more of your break</h1>
          </div>

          <div class="nav-wrap" id="navWrap">
            <nav class="sectionnav" id="sectionNav" aria-label="Sections on this page"></nav>
            <span class="nav-fade nav-fade-left" aria-hidden="true"></span>
            <span class="nav-fade nav-fade-right" aria-hidden="true"></span>
            <button type="button" class="nav-chev nav-chev-left" id="navChevLeft" aria-label="Scroll sections left">&lsaquo;</button>
            <button type="button" class="nav-chev nav-chev-right" id="navChevRight" aria-label="Scroll sections right">&rsaquo;</button>
          </div>
          <div class="content" id="content"></div>
        </div>

      </div>

      <div class="footer" id="footer">
        <div class="fprice" aria-live="polite"><span class="fprice-label">Total price</span><b id="totalFig">&pound;0.00</b></div>
        <div class="fbar">
          <p class="finstruct" id="footNote">Once you've customised your break, select continue to proceed.</p>
          <div class="factions">
            <button class="savebtn" onclick="return false;">Save quote</button>
            <button class="continue" id="continueBtn">Continue</button>
          </div>
        </div>
      </div>
      <!-- the activity costs modal renders here, inside the frame, so it covers the device and
           its sticky bar rather than the whole page -->
      <div id="sheetHost"></div>

    </div>
  </div>

  <div class="sr-only" role="status" aria-live="polite" id="liveAnnounce"></div>
</div>

<script>
/* ============================================================ DATA */

/* Party presets. p1 and p5 are lifted from phase3-accom-fam-hifi.html's PRESETS so the two
   steps test the same bookings. p2 is Phase 3's deliberately awkward "small party first,

/* TOKENS, rebuilt as packs on 19 Aug 2026, replacing the activity calculator. Option A from

   SOURCES, all read 19 Aug 2026: butlins.com Tokens, More about Tokens, How to book your

   THREE FACTS DRIVE THE DESIGN.
   1. The rate is BANDED, so what one token costs depends on how many are bought in one go.
      That is why tokens sit on the booking here rather than in the party blocks: splitting a
      19-guest booking into five purchases would price every party in the worst band and cost
      the guest money. It also follows this file's own precedent, the donation, which sits

      `sure` field stays on the data so build can pick the question back up. */

/* THE ON RESORT RATE, back on 24 Aug 2026 at the client's request. It is what turns this
   section from a price list into an argument: the client's standing problem is that guests do
   not know why tokens are worth buying at booking, and "cheaper the more you buy" answers a
   question nobody asked. What a token costs ON RESORT is the comparison that does.

   [TK] BUTLIN'S HAS NOT PUBLISHED AN ON RESORT TOKEN GRID. It has published exactly one
   quantified claim: "on average a family of 4 could save GBP 15.80 when purchasing 3 tokens
   each before you arrive." Three each for four guests is 12 tokens, GBP 70.20 in advance at the
   term time rate, so that claim implies GBP 86.00 on resort and GBP 7.17 a token. Every
   comparison on this screen is computed from that one implied rate, which is why the section
   carries a single To confirm marker naming it.

   CASH, NEVER A PERCENTAGE. Under the DMCC rules in force since April 2025 a saving claim needs
   a substantiated, comparable basis on the screen that carries it. A cash figure beside a
   stated resort price is that basis. A percentage off an unsourced average is not, which is why
   the percentage line the 19 Aug explorations carried has not come back with the rate.

   FLAT ACROSS BANDS AND BREAK TYPES. The advance rate falls with volume; there is no evidence
   the resort rate does, and none that it moves with the season. Set RESORT_RATE from the real
   grid and every figure on the screen becomes quotable with no other change. */
