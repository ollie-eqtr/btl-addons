<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guests picker — desktop prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#181818;
    --tile-line:#ffffff;
    --num:#d4d3d6;
    --white:#fcfcfc;
    --yellow:#ffd614;
    --red:#da291c;
    --canvas:#a9a9a9;
    --display:'League Gothic','Anton',sans-serif;
    --body:'proxima-nova','Proxima Nova','Montserrat',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--canvas);font-family:var(--body);overflow:hidden;display:flex;flex-direction:column;align-items:center}

  /* ---------- Prototype chrome (outside the design frame) ---------- */
  .switch{display:flex;gap:4px;margin:14px 0 12px;padding:4px;background:#8f8f8f;border-radius:6px}
  .switch button{border:0;background:transparent;color:#1b1b1b;font:700 13px/1 var(--body);padding:9px 14px;border-radius:4px;cursor:pointer}
  .switch button[aria-pressed=true]{background:#1b1b1b;color:#fff}
  .stage{position:relative;flex:1;width:100%;display:flex;justify-content:center}
  .scaler{transform-origin:top center}

  /* ---------- Design frame 1280 x 832 ---------- */
  .frame{position:relative;width:1280px;height:832px;background:var(--bg);color:#fff;overflow:hidden}

  .header{position:absolute;inset:0 0 auto 0;height:76px;z-index:5;
    background:linear-gradient(to top, rgba(24,24,24,0) 0%, #181818 72%);
    display:flex;align-items:center;padding:0 20px}
  .back{display:flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font:700 14px/16px var(--body)}
  .back svg{flex-shrink:0}
  .progress{position:absolute;left:142px;top:36px;width:996px;height:4px;border-radius:3px;background:var(--yellow);
    box-shadow:-6px 0 21px 1px rgba(255,214,20,.8)}
  .close{position:absolute;right:16px;top:26px;width:24px;height:24px;border:0;background:none;cursor:pointer;display:grid;place-items:center}

  .heading{position:absolute;left:109px;top:324px;width:332px}
  .heading h1{font:400 72px/62px var(--display);text-transform:uppercase;color:var(--white)}
  .heading p{margin-top:12px;font:400 20px/24px var(--body);color:rgba(255,255,255,.6)}

  /* Tiles (shared) */
  .opt{display:block;position:relative}
  .opt input{position:absolute;opacity:0;width:1px;height:1px}
  .tile{position:relative;display:grid;place-items:center;width:100%;height:100%;border:1px solid transparent;border-radius:3px;  /* 1708:2850: no tile outline */
   
    font-family:var(--display);color:var(--num);cursor:pointer;transition:background .12s,border-color .12s,color .12s}
  .tile:hover{background:rgba(255,255,255,.05)}
  /* Selected: matches Month Cards 'Selected' variant (708:2533): 4px gap + 2px yellow outer stroke, gradient fill, drop shadow */
  .opt input:checked + .tile{border-color:transparent;color:#fff;background:linear-gradient(to bottom,#2b2b2b,#222121);
    outline:2px solid var(--yellow);outline-offset:4px;box-shadow:4px 10px 27px rgba(0,0,0,.4);z-index:1}
  /* Focus: white ring outside the selected outline so both states read together */
  .opt input:focus-visible + .tile::after{content:"";position:absolute;inset:-10px;border:2px solid #fff;border-radius:9px;pointer-events:none}
  fieldset{border:0}
  legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* Subtext colour, 14/20 */
  .call{font:400 14px/20px var(--body);color:rgba(255,255,255,.6)}
  .call a{color:inherit;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
  .call a:hover{color:#fff}

  /* ---------- Grid panel (shared by A and B) ---------- */
  .scroll{position:absolute;left:598px;top:0;width:626px;  /* sheet centred on the CTA (centre x 911), right edge 1224 = 26px gap to the scrollbar, matching scrollbar to screen edge */
   height:832px;overflow-y:auto;scrollbar-width:none;padding:100px 0 124px;
    scroll-padding:100px 0 124px}  /* keeps keyboard-focused tiles clear of the header and CTA (WCAG 2.4.11) */
  .scroll::-webkit-scrollbar{display:none}
  /* Grey sheet scrolls with the numbers, so it has a visible top and bottom edge */
  .sheet{background:linear-gradient(to bottom,rgba(43,43,43,.6),rgba(34,33,33,.6));border:1px solid rgba(255,255,255,.2);
    border-radius:3px;padding:98px 97.5px 32px}  /* top 98 matches the 97.5px sides; grid centred in the sheet */
  .grid{display:grid;grid-template-columns:repeat(3,135px);grid-auto-rows:135px;gap:12px}  /* 135px squares */
  .grid .tile{font-size:110px;line-height:1}
  /* Centred in the two-card space beside 19, info icon leading */
  .grid .call{grid-column:span 2;align-self:center;justify-self:center;display:flex;align-items:center;gap:12px}
  .call svg{flex-shrink:0}
  .call p{white-space:nowrap}  /* two lines, break after the comma, centred on 19 */
  .call a{white-space:nowrap}
  .track{position:absolute;left:1250px;  /* centred under the close X (centre x 1252) */
   top:100px;width:4px;height:632px;z-index:4;cursor:pointer}
  .track[hidden]{display:none}
  .thumb{position:absolute;left:0;top:0;width:4px;border-radius:3px;background:#646464;cursor:grab;touch-action:none}  /* 3.00:1 on #181818 (now outside the sheet), the WCAG 1.4.11 minimum */
  .thumb:active{cursor:grabbing}
  .track::before,.thumb::before{content:"";position:absolute;inset:0 -10px}  /* 24px pointer target (WCAG 2.5.8) */

  /* Variant A: grid starts lower and fades off the bottom edge */
  .frame[data-variant=a] .scroll{padding-top:76px;  /* sheet top at 76: 36px below the progress bar, matching the 36px above it */
   padding-bottom:160px;  /* sheet ends above the fade */
   
    -webkit-mask-image:linear-gradient(to bottom,transparent 40px,#000 calc(40px + var(--ft,0px)),#000 calc(100% - 140px),transparent);
            mask-image:linear-gradient(to bottom,transparent 40px,#000 calc(40px + var(--ft,0px)),#000 calc(100% - 140px),transparent)}
  /* Top fade starts under the progress bar (y 40) and grows to the same 140px as the bottom fade as you scroll,
     so nothing is faded at rest. */
  /* Scrollbar runs from the sheet top edge (76) to its bottom edge at the end of the scroll (672) */
  .frame[data-variant=a] .track{top:76px;height:596px}  /* top level with the sheet's top edge; bottom level with its bottom edge at the end of the scroll (672) */
  /* Variant B: the 1–9 grid (3 x 135 + 2 x 12 = 429px) sits vertically centred in the frame */

  /* ---------- Variant B: 1–9, then load more ---------- */
  .more{display:none}
  .collapsed .big{display:none}
  /* Link button: 'Read more' style from BTL Booking Redesign (708:4569) */
  .collapsed .more{display:inline-flex;align-items:center;margin-top:24px;padding:3px 0;border:0;border-bottom:1.5px solid #fff;
    background:none;color:#fff;cursor:pointer;font:700 16px/22px var(--body)}
  .scroll.collapsed{padding-bottom:40px}
  /* No tile edges to align to here, so the link centres under the grid */
  .collapsed .more{display:flex;width:max-content;margin:24px auto 0}
  .more:hover{border-bottom-color:var(--yellow)}
  .more:focus-visible{outline:2px solid #fff;outline-offset:4px}
  .big.revealed{animation:in .35s ease-out both}
  @keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  /* ---------- Variant B keeps its previous styling: outlined 4:3 cards, no sheet ---------- */
  .frame[data-variant=b] .scroll{left:617px;width:588px;padding:calc((832px - 429px) / 2) 12px 124px}
  .frame[data-variant=b] .scroll.collapsed{padding-bottom:40px}
  .frame[data-variant=b] .sheet{background:none;border:0;border-radius:0;padding:0}
  .frame[data-variant=b] .grid{grid-template-columns:repeat(3,180px)}
  /* B cards (Amit, 1 Oct): no outline, grey fill. States step up in white overlay like the stepper buttons */
  .frame[data-variant=b] .tile{border-color:transparent;background:rgba(255,255,255,.03)}                          /* rest   ≈ #1f1f1f */
  .frame[data-variant=b].has-selection .opt input:not(:checked) + .tile{background:rgba(255,255,255,.01)}          /* once a number is picked, the others recede ≈ #1b1b1b */
  .frame[data-variant=b] .opt input:not(:checked) + .tile:hover{background:rgba(255,255,255,.10)}                  /* hover  ≈ #2f2f2f */
  .frame[data-variant=b] .opt input:not(:checked) + .tile:active{background:rgba(255,255,255,.14)}                 /* press  ≈ #383838 */
  .frame[data-variant=b] .grid .tile{font-size:72px;padding-top:7px}
  .frame[data-variant=b] .opt input:checked + .tile{border-color:transparent;box-shadow:4px 10px 27px #000}
  .frame[data-variant=b] .call{font-size:20px;line-height:24px}
  .frame[data-variant=b] .grid .call{gap:14px}
  .frame[data-variant=b] .collapsed .more{display:inline-flex;width:auto;margin:24px 0 0}
  .frame[data-variant=b] .track{left:1205px;top:100px;height:632px}


  /* ---------- Variant C hides the scrolling grid ---------- */
  .frame[data-variant=c] #scroll, .frame[data-variant=c] #track{display:none}

  /* ---------- Variant C: stepper, styled from Figma 1722:2941 ---------- */
  /* Full-height panel x 620-1204 (centred on the CTA), same 60% gradient and 20% white edge as A */
  .frame[data-variant=c] #stepperSheet{display:block}
  #stepperSheet{display:none;position:absolute;left:620px;top:-43px;width:584px;height:918px;padding:0}
  .stepper{position:absolute;left:139px;top:367.5px;width:300px}   /* x 760, y 325.5 (inside the 1px panel edge): level with the heading */
  .stepRow{display:flex;gap:6px}
  .countBox{width:196px;height:135px;border:1px solid rgba(255,255,255,.2);border-radius:3px;display:grid;place-items:center;background:var(--bg)}  /* page background #181818, as Figma 1722:2941 */
  .count{width:100%;height:100%;padding:0;border:0;border-radius:3px;background:transparent;color:#fff;text-align:center;
    font:400 110px/1 var(--display);caret-color:var(--yellow);-moz-appearance:textfield;appearance:textfield}
  .count::-webkit-outer-spin-button,.count::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .count:hover{background:rgba(255,255,255,.07)}   /* ≈ #282828: lighter than the panel (#202020) so it still reads as hover */
  .count:focus{outline:none}
  /* Editing: the box's own border turns solid white at 2px (inset shadow adds the second pixel, so nothing shifts) */
  .countBox:focus-within{border-color:#fff;box-shadow:inset 0 0 0 1px #fff}
  .steps{display:flex;flex-direction:column;gap:6px}
  .step{width:98px;height:64.5px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.2);border-radius:3px;background:var(--bg);
    color:#fff;cursor:pointer;transition:background .12s,border-color .12s,color .12s;touch-action:none}
  .step{user-select:none;-webkit-user-select:none}
  .step:hover{background:#282828}
  /* Pressed: lighter fill and brighter edge while the pointer or key is held (stays on during hold-to-repeat) */
  .step:not(:disabled):active, .step.pressed{background:#363636;border-color:rgba(255,255,255,.5)}
  .step:focus-visible{outline:2px solid #fff;outline-offset:4px}
  /* Disabled keeps the dark fill (fading the whole button would blend it into the panel); icon and edge dim instead */
  .step:disabled{cursor:default;background:var(--bg);color:rgba(255,255,255,.3);border-color:rgba(255,255,255,.08)}
  .stepNote{display:flex;align-items:center;gap:12px;margin-top:12px;color:rgba(255,255,255,.6);font:400 14px/17px var(--body)}
  .stepNote svg{flex-shrink:0}
  .stepNote b{font-weight:700}
  .stepNote a{color:inherit;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
  .stepNote a:hover{color:#fff}

  /* Footer + CTA */
  .footer{position:absolute;left:0;right:0;bottom:0;height:100px;z-index:5;pointer-events:none;
    background:linear-gradient(to top,#181818 0%,rgba(24,24,24,0) 100%);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    -webkit-mask-image:linear-gradient(to top,#000 60%,transparent);mask-image:linear-gradient(to top,#000 60%,transparent);
    opacity:0;transition:opacity .3s}
  .frame.has-selection .footer{opacity:1}
  .cta{position:absolute;left:650px;bottom:24px;width:522px;height:52px;z-index:6;border:0;border-radius:3px;background:var(--red);color:#fff;
    font:700 18px/1 var(--body);letter-spacing:-.18px;text-transform:uppercase;cursor:pointer;box-shadow:4px 0 50px rgba(0,0,0,.4)}
  .cta:focus-visible{outline:2px solid #fff;outline-offset:4px}
  /* Hidden until a number is chosen, then jumps up from below the frame */
  .cta{transform:translateY(160%);visibility:hidden;
    transition:transform .45s cubic-bezier(.34,1.56,.64,1), visibility 0s linear .45s}
  .cta.show{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.34,1.56,.64,1), visibility 0s}
  @media (prefers-reduced-motion: reduce){
    .cta,.cta.show,.footer{transition:none}
    .big.revealed{animation:none}
  }

  .toast{position:absolute;left:50%;top:92px;transform:translateX(-50%);z-index:9;background:#fff;color:#1b1b1b;
    font:700 14px/1 var(--body);padding:12px 16px;border-radius:4px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}

</style>
</head>
<body>

<div class="switch" role="group" aria-label="Prototype variant">
  <button type="button" data-v="a" aria-pressed="true">A · Scrolling grid 1–19</button>
  <button type="button" data-v="b" aria-pressed="false">B · 1–9, then load more</button>
  <button type="button" data-v="c" aria-pressed="false">C · Stepper</button>
</div>

<div class="stage"><div class="scaler" id="scaler">
<div class="frame" id="frame" data-variant="a">

  <div class="header">
    <a class="back" href="#"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10.5 3 5.5 8l5 5" stroke="#fff" stroke-width="2"/></svg>Weekenders</a>
    <div class="progress" aria-hidden="true"></div>
    <button class="close" aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1l12 12M13 1 1 13" stroke="#fff" stroke-width="2"/></svg></button>
  </div>

  <div class="heading">
    <h1 id="q">How many of you are there?</h1>
    <p>Big groups choose who stays with who later on.</p>
  </div>

  <div class="scroll" id="scroll" tabindex="-1">
    <div class="sheet">
    <fieldset aria-labelledby="q"><legend>How many of you are there?</legend>
      <div class="grid" id="grid"></div>
    </fieldset>
    <button type="button" class="more" id="moreBtn" aria-label="I have a bigger group! Show 10 to 19 guests">I have a bigger group!</button>
    </div>
  </div>
  <div class="track" id="track" aria-hidden="true"><div class="thumb" id="thumb"></div></div>

  <!-- Variant C: stepper -->
  <div class="sheet" id="stepperSheet">
    <div class="stepper">
      <div class="stepRow">
        <div class="countBox">
          <input class="count" id="count" type="number" inputmode="numeric" min="1" max="19" step="1" value="2"
            aria-labelledby="q" aria-describedby="stepNote">
        </div>
        <div class="steps">
          <button type="button" class="step" id="plus" aria-label="One more guest"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4.5v15m7.5-7.5h-15" stroke="currentColor" stroke-width="1.5"/></svg></button>
          <button type="button" class="step" id="minus" aria-label="One fewer guest"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19.5 12h-15" stroke="currentColor" stroke-width="1.5"/></svg></button>
        </div>
      </div>
      <div class="stepNote" id="stepNote">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p><b>Maximum 19</b> guests, please call to make a larger booking, on <a href="tel:03301009732">0330 100 9732</a></p>
      </div>
    </div>
  </div>

  <div class="footer" aria-hidden="true"></div>
  <button class="cta" id="cta">View accommodation</button>
  <div class="toast" id="toast" role="status"></div>
  <div class="sr" id="live" aria-live="polite"></div>
</div>
</div></div>

<script>
const $ = s => document.querySelector(s);
const frame = $('#frame'), live = $('#live');
const scroll = $('#scroll'), track = $('#track'), thumb = $('#thumb'), grid = $('#grid'), cta = $('#cta');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let selected = null;

for (let n = 1; n <= 19; n++){
  const l = document.createElement('label'); l.className = 'opt' + (n >= 10 ? ' big' : '');
  l.innerHTML = `<input type="radio" name="guests" value="${n}" aria-label="${n} ${n===1?'guest':'guests'}"><span class="tile" aria-hidden="true">${n}</span>`;
  grid.appendChild(l);
}
grid.insertAdjacentHTML('beforeend', '<div class="call big"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="9.25" stroke="currentColor" stroke-width="1.5"/><path d="M10 8.75v5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="5.9" r="1" fill="currentColor"/></svg><p>To book with more guests,<br>please call on <a href="tel:03301009732">0330 100 9732</a></p></div>');

function setSelected(n){
  selected = n;
  cta.classList.toggle('show', n !== null);
  frame.classList.toggle('has-selection', n !== null);
}
function radioGroup(group){
group.addEventListener('change', e => {
  setSelected(+e.target.value);
  live.textContent = e.target.getAttribute('aria-label') + ' selected';
});
/* Clicking (or pressing Space on) the selected tile clears it. Arrow-key moves never clear. */
let wasChecked = null, spaceOnChecked = false;
group.addEventListener('pointerdown', e => {
  const opt = e.target.closest('.opt'); wasChecked = opt ? opt.querySelector('input').checked : null;
});
group.addEventListener('click', e => {
  if (e.target.type !== 'radio') return;
  const input = e.target, clearIt = wasChecked === true;
  wasChecked = null;
  if (clearIt) setTimeout(() => clear(input));   // after the browser's own radio activation has run
});
group.addEventListener('keydown', e => {
  if (e.target.type !== 'radio') return;
  wasChecked = null;
  spaceOnChecked = e.key === ' ' && e.target.checked;
});
/* Space on an already-checked radio fires no click, so clear it here */
group.addEventListener('keyup', e => {
  if (e.key === ' ' && spaceOnChecked && e.target.checked){ const input = e.target; setTimeout(() => clear(input)); }
  spaceOnChecked = false;
});
}
function clear(input){ input.checked = false; setSelected(null); live.textContent = 'Selection cleared'; }
radioGroup(grid);

/* ---------- Variant C: stepper (1 to 19, default 2) ---------- */
const count = $('#count'), minus = $('#minus'), plus = $('#plus');
let reachedLimit = false;
function setCount(n, announce = true, overLimit = false){
  n = Math.max(1, Math.min(19, Math.round(n) || 1));
  count.value = n;
  minus.disabled = n <= 1; plus.disabled = n >= 19;
  const atLimit = (n >= 19 || overLimit) && !reachedLimit;   // the maximum note is always visible; announce it the first time someone hits it
  reachedLimit = n >= 19 || overLimit;
  setSelected(n);
  if (announce) live.textContent = n + (n === 1 ? ' guest' : ' guests') + (atLimit ? '. Maximum 19 guests. To book a larger group, call 0330 100 9732' : '');
}
/* Hold − or + to repeat */
function holdRepeat(btn, d){
  let t1, t2;
  const stop = () => { clearTimeout(t1); clearInterval(t2); btn.classList.remove('pressed'); };
  btn.addEventListener('pointerdown', e => {
    if (btn.disabled || e.button !== 0) return;
    btn.classList.add('pressed');
    setCount(+count.value + d);
    t1 = setTimeout(() => { t2 = setInterval(() => { if (btn.disabled) return stop(); setCount(+count.value + d); }, 90); }, 450);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); btn.classList.add('pressed'); setCount(+count.value + d); }
  });
  btn.addEventListener('keyup', e => { if (e.key === 'Enter' || e.key === ' ') btn.classList.remove('pressed'); });
  btn.addEventListener('blur', stop);
}
holdRepeat(minus, -1); holdRepeat(plus, 1);
/* Typing: digits only, two at most; values over 19 snap to 19 and show the phone line */
count.addEventListener('input', () => {
  const raw = count.value.replace(/\D/g, '').slice(0, 2);
  if (raw === '') return;                       // let people clear the field while typing
  const n = +raw;
  if (n > 19) setCount(19, true, true);
  else if (n >= 1) setCount(n, false);
});
count.addEventListener('blur', () => { if (count.value === '' || +count.value < 1) setCount(1); });
count.addEventListener('keydown', e => {          // native arrows step by 1 within min/max; keep state in sync
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown'){ e.preventDefault(); setCount(+count.value + (e.key === 'ArrowUp' ? 1 : -1)); }
  if (e.key === 'Enter') count.blur();
});
count.addEventListener('wheel', e => e.preventDefault(), {passive:false});   // stop the wheel changing the number by accident

/* ---------- Variant switcher ---------- */
function setVariant(v){
  frame.dataset.variant = v;
  document.querySelectorAll('.switch button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  grid.querySelectorAll('input').forEach(i => i.checked = false);
  setSelected(null);
  if (v === 'c') setCount(2, false);
  scroll.classList.toggle('collapsed', v === 'b');
  grid.querySelectorAll('.big').forEach(el => el.classList.remove('revealed'));
  scroll.scrollTop = 0; scroll.style.setProperty('--ft', '0px'); syncThumb();
  try { history.replaceState(null, '', '?v=' + v); } catch(e){}
}
document.querySelectorAll('.switch button').forEach(b => b.addEventListener('click', () => setVariant(b.dataset.v)));

/* ---------- Custom scrollbar (only shown when the grid overflows) ---------- */
function syncThumb(){
  const max = scroll.scrollHeight - scroll.clientHeight;
  track.hidden = max <= 0;
  if (max <= 0) return;
  const th = Math.max(40, track.clientHeight * scroll.clientHeight / scroll.scrollHeight);
  thumb.style.height = th + 'px';
  thumb.style.transform = `translateY(${(scroll.scrollTop / max) * (track.clientHeight - th)}px)`;
}
scroll.addEventListener('scroll', () => { syncThumb(); scroll.style.setProperty('--ft', Math.min(scroll.scrollTop, 140) + 'px'); });
let drag = null;
thumb.addEventListener('pointerdown', e => {
  drag = {y: e.clientY, top: scroll.scrollTop}; thumb.setPointerCapture(e.pointerId); e.preventDefault();
});
thumb.addEventListener('pointermove', e => {
  if (!drag) return;
  const k = currentScale();
  const th = thumb.getBoundingClientRect().height / k;
  const max = scroll.scrollHeight - scroll.clientHeight;
  scroll.scrollTop = drag.top + ((e.clientY - drag.y) / k) * (max / (track.clientHeight - th));
});
thumb.addEventListener('pointerup', () => drag = null);
track.addEventListener('pointerdown', e => {
  if (e.target === thumb) return;
  const t = thumb.getBoundingClientRect();
  scroll.scrollBy({top: (e.clientY < t.top ? -1 : 1) * scroll.clientHeight * 0.8, behavior: reduce ? 'auto' : 'smooth'});
});

/* Wheel or trackpad anywhere in the frame scrolls the grid (the page itself never scrolls) */
/* Smooth scrolling: each wheel or trackpad movement sets a target and the grid eases towards it.
   Applies over the panel too. Reduced-motion users get instant scrolling. */
let target = null, raf = null;
function step(){
  const d = target - scroll.scrollTop;
  if (Math.abs(d) < 0.5){ scroll.scrollTop = target; target = null; raf = null; return; }
  scroll.scrollTop += d * 0.16;
  raf = requestAnimationFrame(step);
}
function smoothBy(dy){
  const max = scroll.scrollHeight - scroll.clientHeight;
  target = Math.max(0, Math.min(max, (target ?? scroll.scrollTop) + dy));
  if (reduce){ scroll.scrollTop = target; target = null; return; }
  if (!raf) raf = requestAnimationFrame(step);
}
function stopSmooth(){ if (raf) cancelAnimationFrame(raf); raf = null; target = null; }
frame.addEventListener('wheel', e => {
  if (frame.dataset.variant === 'c') return;
  const dy = e.deltaY * (e.deltaMode === 1 ? 40 : 1);
  if (frame.dataset.variant === 'b'){            // B: native scroll over the grid, instant elsewhere (unchanged)
    if (scroll.contains(e.target)) return;
    e.preventDefault(); scroll.scrollBy({top: dy}); return;
  }
  e.preventDefault();
  smoothBy(dy);
}, {passive:false});
thumb.addEventListener('pointerdown', stopSmooth);

/* Keyboard focus: bring the whole tile into view, clear of header and CTA (scroll-padding) */
scroll.addEventListener('focusin', e => {
  const tile = e.target.closest('.opt'); if (tile){ stopSmooth(); tile.scrollIntoView({block:'nearest', behavior: (reduce || frame.dataset.variant === 'b') ? 'auto' : 'smooth'}); }
});

/* ---------- Variant B: load more ---------- */
$('#moreBtn').addEventListener('click', () => {
  const ten = grid.querySelector('input[value="10"]');
  scroll.classList.remove('collapsed');
  grid.querySelectorAll('.big').forEach(el => el.classList.add('revealed'));
  ten.focus({preventScroll:true});            // keyboard users land on 10, not back at the top
  syncThumb();
  scroll.scrollTo({top: ten.closest('.opt').offsetTop - 100, behavior: reduce ? 'auto' : 'smooth'});
  live.textContent = '10 to 19 added';
});

/* ---------- CTA ---------- */
$('#cta').addEventListener('click', () => {
  const t = $('#toast'); t.textContent = `${selected} ${selected===1?'guest':'guests'} → accommodation`;
  t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1600);
});

/* ---------- Fit the 1280 x 832 frame to the window ---------- */
const scaler = $('#scaler');
function currentScale(){ return +(scaler.dataset.k || 1); }
function fit(){
  const k = Math.min(1, (innerWidth - 32) / 1280, (innerHeight - 80) / 832);
  scaler.style.transform = `scale(${k})`; scaler.dataset.k = k;
  scaler.style.height = 832 * k + 'px';
  syncThumb();
}
addEventListener('resize', fit);
document.fonts.ready.then(fit);
fit();
const v = new URLSearchParams(location.search).get('v');
if (['b','c'].includes(v)) setVariant(v);
</script>
</body>
