/* ============================================================ HELPERS */
function gbp(n){ return "£"+n.toFixed(2); }
/* PARTY BLOCKS REMOVED (Oliver, 21 Aug). Nothing on this screen is charged per party: every
   product is per person, per item, or whole booking. The preset's party array survives as
   DATA - it still carries the guest mix, which parties took a dining plan on step 2, and the
   accommodation unit count - but the screen treats the booking as one party. */
function rawParties(){ return PRESETS[state.presetId].parties; }
function bookingParty(){
  return rawParties().reduce(function(a,p){
    return { adults:a.adults+p.adults, children:a.children+p.children,
             toddlers:a.toddlers+p.toddlers, infants:a.infants+p.infants }; },
    { adults:0, children:0, toddlers:0, infants:0 });
}
function parties(){ return [bookingParty()]; }
/* ACCOMMODATION UNITS on the booking. Early check-in and late check-out are charged PER UNIT,
   and that multiplier used to be the party count. With parties gone it comes from the
   accommodation carried in from step 2, which is what a unit actually is. Miss this and the
   two per-unit products silently start charging for a single unit. */
function nUnits(){ return accom().units.length; }
function nParties(){ return parties().length; }
function multi(){ return nParties()>1; }
function pGuests(p){ return p.adults+p.children+p.toddlers+p.infants; }
function pPay(p){ return p.adults+p.children+p.toddlers; }   /* under 2s go free */
function totalGuests(){ return parties().reduce(function(n,p){ return n+pGuests(p); },0); }
function payGuests(){ return parties().reduce(function(n,p){ return n+pPay(p); },0); }
function partyLabel(i){ return multi()?("Party "+(i+1)):"Your party"; }
function accom(){ return ACCOM[state.presetId]; }
function resortName(){ return state.resort==="bognor"?"Bognor Regis":"Minehead"; }
function spaActive(){ return state.resort==="bognor"; }
function circusActive(){ return state.breakType==="summer"; }
/* Tokens show at Bognor Regis (user, 19 Aug), where the capture puts them first in the list.
   NOTE: the Minehead capture in content inventory v0.3 also lists a Tokens tab, so this may
   belong at both resorts. If so it is one word: return true. See the open questions. */
function tokensActive(){ return state.resort==="bognor"; }
function announce(t){ document.getElementById('liveAnnounce').textContent=t; }
function px(i){ if(!state.px[i]) state.px[i]={aa:0,cir:0,spa:0,tow:0}; return state.px[i]; }
function resetParties(){ state.px=[]; }

/* ---- costs ---- */
function vipCost(){ return state.book.vip?PRICE.vipPP*payGuests():0; }
function earlyCost(){ return state.book.early?PRICE.earlyPerUnit*nUnits():0; }
function lateCost(){ return state.book.late?PRICE.latePerUnit*nUnits():0; }
function aaCost(){ return state.px.reduce(function(t,e,i){ return t+(e?e.aa:0)*PRICE.allActionPP; },0); }
function cirCost(){ return circusActive()?state.px.reduce(function(t,e){ return t+(e?e.cir:0)*PRICE.circusPP; },0):0; }
function spaCost(){ return spaActive()?state.px.reduce(function(t,e){ return t+(e?e.spa:0)*PRICE.spaPP; },0):0; }
function towCost(){ return state.px.reduce(function(t,e){ return t+(e?e.tow:0)*PRICE.towelEach; },0); }
/* ---- tokens: banded pricing on one booking-level purchase ---- */
function tokenBandFor(n){
  for(var i=0;i<TOKEN_BANDS.length;i++) if(n>=TOKEN_BANDS[i].min&&n<=TOKEN_BANDS[i].max) return TOKEN_BANDS[i];
  return TOKEN_BANDS[TOKEN_BANDS.length-1];
}
/* the school holiday column is the dearer one. The break toggle switches it, which is the
   real behaviour: token prices are published per break type, not per resort. */
function tokenRate(n){ var b=tokenBandFor(n); return state.breakType==="summer"?b.hol:b.term; }
function tokenRateSure(n){ return tokenBandFor(n).sure; }
function resortRate(n){ var b=tokenBandFor(n||1); return state.breakType==="summer"?b.holRes:b.res; }
function resortCost(n){ return n*resortRate(n); }
/* MAY BE NEGATIVE, AND THAT IS THE POINT. Below 12 tokens the advance rate is GBP 8.50, above
   the implied resort rate, so a small purchase saves nothing at all. Every caller checks the
   sign before it prints the word "save": a screen that claims a saving it cannot show is the
   one defect in here that would survive into build and cost Butlin's money. */
function tokenSaving(n){ return n>0 ? resortCost(n)-(n*tokenRate(n)) : 0; }
/* the smallest purchase that actually beats the resort rate, DERIVED from the bands rather than
   written into the copy. If Butlin's confirm a cheaper sub-12 band this number moves on its own
   and not one sentence has to be rewritten. */
function savingFrom(){
  for(var i=0;i<TOKEN_BANDS.length;i++){
    var r=state.breakType==="summer"?TOKEN_BANDS[i].hol:TOKEN_BANDS[i].term;
    if(r<resortRate()) return TOKEN_BANDS[i].min;
  }
  return null;
}
/* what a token costs a go, read off the activity list rather than asserted in the copy */
function tokPerRange(){
  var ps=TOKEN_ACTIVITIES.map(function(a){ return a.per; });
  return { lo:Math.min.apply(null,ps), hi:Math.max.apply(null,ps) };
}
function tokensTotal(){ return tokensActive()?(state.book.tokens||0):0; }
function tokCost(){ var n=tokensTotal(); return n>0?n*tokenRate(n):0; }
/* the ladder. Butlin's guide is 3 each, then 4 and 5. A small booking lands below the lowest
   band we hold a rate for, so it snaps to the three published bands instead of quoting a
   placeholder as a recommendation. */
/* THE LADDER EXPRESSES THE PERSONAS, 2, 4 and 6 tokens per chargeable guest, so "Dip in" is
   always a couple of goes each and "Never sit still" is always six, whatever the party size.
   The earlier rule snapped small parties up to the published bands (12/16/20), which kept every
   pack priced but made "Dip in" mean four goes each on a family of four and, on the 19-guest
   preset, a GBP 299.70 pack wearing the smallest persona. Sizes now hold their meaning and the
   cost of that is visible: on a small party the lowest pack falls under 12 tokens, where the
   rate was cropped out of our capture, so it carries the placeholder flag. That is the case for
   getting those bands from Butlin's, not a reason to hide the pack. */
/* FIXED SIZES (Sarah, 24 Aug; built 25 Aug): 5, 10 and 15, DECOUPLED from the party. The
   2/4/6-each ladder priced itself off the guest count; Sarah prefers arbitrary round sizes,
   and on the published grid all three carry a real saving on every break type, so the
   decoupling costs nothing commercially. PACK_EACH is retired with the per-guest maths. */
var PACK_SIZES=[5,10,15];
function tokenPacks(){
  return PACK_SIZES.map(function(n){
    return { n:n, rate:tokenRate(n), cost:n*tokenRate(n), sure:tokenBandFor(n).sure };
  });
}
/* THE LARGE VARIANT'S OWN LADDER (Oliver's hi-fi, 27 Aug). The hi-fi's pack bands pair the
   total with a per-guest count - "6 TOKENS / 2 each" - which only divides cleanly on the
   2/4/6-each ladder the fixed sizes replaced. So Tokens Large goes back to per-guest packs,
   and ONLY Tokens Large: tokenPacks() keeps Sarah's fixed 5/10/15 for the Slim rows, and the
   two ladders quote the same TOKEN_BANDS grid either way. */
var PACK_EACH=[2,4,6];
function largePacks(){
  var g=payGuests();
  return PACK_EACH.map(function(e){ var n=e*g;
    return { n:n, each:e, rate:tokenRate(n), cost:n*tokenRate(n), sure:tokenBandFor(n).sure };
  });
}
function tokenNextBand(n){
  if(n<=0) return null;
  var cur=tokenRate(n), out=null;
  TOKEN_BANDS.forEach(function(b){
    var r=state.breakType==="summer"?b.hol:b.term;
    if(b.min>n && r<cur && !out) out={ min:b.min, rate:r, add:b.min-n, delta:(b.min*r)-(n*cur) };
  });
  return out;
}
function donationCost(){ return state.book.donation?PRICE.donation:0; }
function roomPickCost(){ return state.book.roomPick?ROOM_PICK*nUnits():0; }
/* what one party costs in extras. The whole-booking items are charged to the party they
   cover, which is what makes the per-party figure add up to the booking total. */

/* ---- dining carried in ---- */
function diningFor(i){
  if(!state.diningPrev) return null;
  if(!DINING_ON[state.presetId][i]) return null;
  var g=pGuests(rawParties()[i]);
  return { name:DINING_NAME, now:DINING_PP.now*g, was:DINING_PP.was*g };
}
function anyDining(){ for(var i=0;i<rawParties().length;i++) if(diningFor(i)) return true; return false; }
function diningTotals(){
  var now=0,was=0;
  /* dining was chosen per party on step 2 and is read-only here, so its total still sums the
     raw data. That is accounting carried in, not a party block on this screen. */
  for(var i=0;i<rawParties().length;i++){ var d=diningFor(i); if(d){ now+=d.now; was+=d.was; } }
  return {now:now,was:was,save:was-now};
}

function computeAll(){
  var a=accom(), accomBase=a.units.reduce(function(t,v){ return t+v; },0);
  var d=diningTotals();
  var vip=vipCost(), aa=aaCost(), cir=cirCost(), spa=spaCost(), tok=tokCost(),
      early=earlyCost(), late=lateCost(), tow=towCost(), don=donationCost(), pick=roomPickCost();
  var extras=vip+tok+aa+cir+spa+early+late+tow+don;
  return { accom:accomBase, pick:pick, accomTotal:accomBase+pick,
    diningNow:d.now, diningWas:d.was, diningSave:d.save,
    vip:vip, tokens:tok, tokenCount:tokensTotal(), allAction:aa, circus:cir, spa:spa,
    early:early, late:late, towels:tow, donation:don,
    extras:extras, grand:accomBase+pick+d.now+extras };
}

/* ============================================================ UI HELPERS */
/* scopeTag(scope, label): the glyph is keyed off the scope; an optional label overrides the
   text so a count chip can replace the scope descriptor without losing the variant.
   Text glyphs stand in for the hi-fi's pill icons; this folder has no assets. */
/* The glyph must match the basis. Anything unrecognised falls through to the whole-booking
   house, so a new scope needs a case here or it will silently claim to cover the booking.
   Render check, 19 Aug: "Per token" did exactly that before this line existed. */
/* the flagged figure marker. It read "TK", the newsroom convention for "to come". Nobody
   outside the workstream recognises that on a screen, so the chip says what it means and TK
   stays the internal shorthand in comments. (user, 20 Aug) */
function tkMark(){ return '<span class="tok-tk">To confirm</span>'; }
function scopeTag(scope,label){
  var ico = scope==="Per item"  ? "▤"
          : scope==="Per token" ? "◉"
          : scope==="Per person"? "◎"
          : "⌂";
  return '<span class="scope-tag"><span class="st-ico" aria-hidden="true">'+ico+'</span>'+(label||scope)+'</span>';
}
function addBtn(on,attrs,off,onl,disabled,disLabel){
  off=off||"Add to booking"; onl=onl||"Added to booking";
  if(disabled) return '<button type="button" class="btn-add" aria-disabled="true" '+attrs+'>'+(disLabel||off)+'</button>';
  return '<button type="button" class="btn-add'+(on?' is-added':'')+'" aria-pressed="'+(on?'true':'false')+'" '+attrs+'>'+
    (on?('<span class="tick">✓</span> '+onl):off)+'</button>';
}
/* the quantity readout is NOT aria-hidden: the sketch hid it with no substitute, which left
   screen reader users with no way to read the current count. */
function stepper(qty,attrs,name,atMax,cls){
  return '<div class="stepper'+(cls?' '+cls:'')+'" '+attrs+'>'+
    '<button type="button" class="step-btn" data-dir="-1" aria-label="Decrease, '+name+'"'+(qty<=0?' aria-disabled="true"':'')+'>−</button>'+
    '<span class="qty" aria-label="'+name+', '+qty+'">'+qty+'</span>'+
    '<button type="button" class="step-btn" data-dir="1" aria-label="Increase, '+name+'"'+(atMax?' aria-disabled="true"':'')+'>+</button></div>';
}
/* qtyControl, from the BBW hi-fi: the stepper for partial cover sits beside one button that
   covers everyone in one tap. Any quantity flips that button to the added state with a
   running count. This is the answer to P0's "laborious to add 1 by 1". */
function qtyControl(o){
  var on=o.qty>0, full=o.qty>=o.max&&o.max>0;
  var label = on ? (o.qty+' of '+o.max+' '+o.noun+' added') : ('Add for all '+o.max+' '+o.noun);
  return '<div class="xc-control">'+stepper(o.qty,o.attr,o.name,full)+
    '<button type="button" class="btn-add'+(on?' is-added':'')+'" aria-pressed="'+(on?'true':'false')+'" '+o.allAttr+'>'+
    (on?'<span class="tick">✓</span> ':'')+label+'</button></div>';
}
/* COST DISPLAY, carried verbatim from the BBW hi-fi. Two archetypes, and the pill must
   describe what the hero number represents.
   1. QUANTITY cards (All Action, Circus, Spa, Towels): nothing added, hero = the rate and the
      pill = the scope descriptor. Once a quantity exists, hero = the running total, a sub-line
      states the rate, and the pill becomes a count chip.
   2. WHOLE-BOOKING cards (VIP, check-in pair): hero = the total always, sub-line = the rate,
      pill = the scope. No added-state transition. */
/* the two builders take the SAME option object, so a product switches card type by changing
   which one it calls. Shared pieces are built once by cardMore, cardIncl and cardBar. */
function cardMore(o){
  return o.more ? '<button type="button" class="dc-more-toggle" data-more="'+o.id+'" aria-expanded="false" aria-controls="more-'+o.id+'">Read more</button>'+
                  '<div class="dc-more" id="more-'+o.id+'">'+o.more+'</div>' : '';
}
function cardIncl(o){
  return o.incl ? '<ul class="dc-incl">'+o.incl.map(function(x){ return '<li>'+x+'</li>'; }).join('')+'</ul>' : '';
}
function cardBar(o){
  return '<div class="cbar"><div class="cbar-left"><div class="price"><span class="now">'+o.price+'</span>'+
    (o.priceSub?'<span class="pp">'+o.priceSub+'</span>':'')+'</div>'+scopeTag(o.scope,o.scopeLabel)+'</div>'+
    o.control+'</div>';
}
/* REGULAR CARD: icon-led, for the everyday extras. */
function extraCard(o){
  return '<div class="card xcard'+(o.added?' is-added':'')+'" id="card-'+o.id+'">'+
    '<div class="xc-body"><div class="xc-head"><span class="xc-ico" aria-hidden="true">'+o.icon+'</span><h3>'+o.title+'</h3></div>'+
    '<p class="desc">'+o.desc+'</p>'+cardIncl(o)+(o.body||'')+cardMore(o)+'</div>'+
    cardBar(o)+'</div>';
}
/* FEATURE CARD: photo pane beside the copy, for the premium sells. The title takes its own
   band above the split so it spans both columns, and no icon is used: the photo is the mark. */
function featureCard(o){
  return '<div class="card feature'+(o.added?' is-added':'')+'" id="card-'+o.id+'">'+
    '<h3 class="dc-head">'+o.title+'</h3>'+
    '<div class="feature-card">'+
    '<div class="ph-img square" aria-hidden="true"><span>Photo: '+(o.photo||o.title)+'</span></div>'+
    '<div class="fc-main"><div class="fc-pad">'+
    '<p class="desc">'+o.desc+'</p>'+cardIncl(o)+(o.body||'')+cardMore(o)+'</div>'+
    cardBar(o)+'</div></div></div>';
}

/* ============================================================ PRODUCTS
   Every product takes a party index. In a single-party booking they render straight into
   product sections; in a multi-party booking they render inside that party's block.
   `k` suffixes every id so the anchors and read-more toggles stay unique across parties. */

/* ---- Early Access VIP Pass: applies to every guest on the booking ---- */
function xVip(i){
  var p=parties()[i], pay=pPay(p), on=state.book.vip, total=PRICE.vipPP*pay;
  var note = multi()
    ? '<div class="allnote">Applies to every guest on the booking, so adding it here adds it for all '+nParties()+' parties. The price shown is '+partyLabel(i)+'\'s share.</div>'
    : '';
  /* FEATURE CARD. This is the premium sell on the step, so it takes the photo-led layout
     BBW gives its VIP Pass rather than the icon-led card the everyday extras use. */
  return featureCard({ id:"vip-"+i, title:"Early Access VIP Pass", added:on,
    photo:"VIP Pass",
    scope: multi()?"All parties":"Whole booking",
    desc:"Book shows and activities 3 days before slots open to other guests, plus venue entry 15 minutes early.",
    incl:["Book shows and activities 3 days early","Into entertainment venues 15 minutes before doors","Covers every guest on the booking","Under 2s go free"],
    more:"Reserve seats for shows and book activity slots 3 days before general release, and get into entertainment venues 15 minutes before doors open, so you can pick your spot. Charged for every guest aged 2 and over.",
    body:note,
    price:gbp(total), priceSub:gbp(PRICE.vipPP)+' per person × '+pay+' guest'+(pay===1?'':'s'),
    control:'<div class="xc-control">'+addBtn(on,'data-book="vip"','Add to booking','Added to booking')+'</div>' });
}

/* ---- Tokens, as packs. Option A from the review, 19 Aug 2026.
   The calculator this replaces asked the guest to price 20 activities across ten different
   units, in a currency whose own rate moves with the quantity, and then to remember the answer
   for a modal that opened at zero. Here the bands Butlin's already prices in become three
   buyable packs, the list becomes reassurance behind a link, and one tap commits.
   BOOKING LEVEL, so it renders once, outside the party blocks. See the note on TOKEN_BANDS. ---- */
/* "roughly how many activities" as Oliver asked, derived from the real token costs rather than
   asserted. Party-level goes differentiate the tiers; the per-guest slice sits alongside. */
function packBullets(n,g){
  var each=n/g;
  var out=[];
  out.push("<b>"+each+" tokens each</b> for your "+g+" chargeable guest"+(g===1?"":"s"));
  out.push(Math.floor(n/2)+" goes on the 2-token favourites, like VR-Cade or High Ropes");
  out.push("Or "+n+" goes on the 1-token ones, like Laser Tag and TechPutt");
  if(n>=6) out.push("An Escape Room for up to six takes 6 of them");
  return out;
}

/* WHAT THIS PACK SAVES, or honestly nothing. Two branches, and the second one is the reason
   this function exists rather than one line of template. On a party of four the smallest pack is
   8 tokens, which falls in the sub-12 band at GBP 8.50 a token - ABOVE the implied resort rate.
   That pack saves nothing, and the screen says so and points at the size where the saving
   starts, rather than printing a negative number or quietly hiding the comparison on the one
   card where it is unflattering. The client should see that, and so should Butlin's: it is the
   case for getting the real sub-12 band, and it makes the smallest tier's weakness legible. */
/* RESHAPED to the hi-fi (27 Aug): one line, "Save £x.xx on resort prices". The struck resort
   price came off with the hi-fi; the honest no-saving branch stays, because a ladder change or
   a grid change can put a size back above the resort rate and the card must say so. */
function packSaveRow(pk){
  var save=tokenSaving(pk.n), from=savingFrom();
  if(save<=0){
    return '<p class="pk-save is-none"><span>'+gbp(resortCost(pk.n))+' on resort, so this size '+
      'saves nothing.'+(from?' Savings start at '+from+' tokens.':'')+'</span></p>';
  }
  return '<p class="pk-save"><b class="pk-off">Save '+gbp(save)+'</b> on resort prices</p>';
}

/* ---- V2: BUY NOW, BOOK LATER. The three beats the client asked for, 24 Aug 2026.
   1. why buying now is worth money, against a resort price rather than against itself
   2. that nothing is being booked today, which is the confusion they want designed out
   3. when the booking does happen, and what moves it earlier
   Every figure is computed. The rates come from the bands, the activity count and the range of
   token costs come from TOKEN_ACTIVITIES, so no sentence in here can go stale on its own. ---- */
/* SUPERSEDED 25 Aug by the B13 section shape: nothing calls this. Kept for the record; note
   its beat-1 figure predates the published grid and must not be revived as-is. */
function tokHow(){
  var best=Math.min.apply(null,tokenPacks().map(function(p){ return p.rate; }));
  var r=tokPerRange();
  function beat(n,t,d){
    return '<li class="th-step"><span class="th-num" aria-hidden="true">'+n+'</span>'+
      '<span class="th-t">'+t+'</span><span class="th-d">'+d+'</span></li>';
  }
  /* NO HEADING OF ITS OWN (Oliver, 24 Aug). It said "Buy tokens now, book activities later",
     which is now the job of the section heading above it - two headings a paragraph apart were
     saying the same thing twice. */
  return '<div class="tok-how">'+
    '<ol class="th-steps">'+
      beat(1,'Buy now, pay less','A token costs <b>'+gbp(resortRate())+'</b> on resort. '+
        'Buy it with your break and you pay from <b>'+gbp(best)+'</b>.')+
      beat(2,'Nothing is booked today','You are choosing how many tokens to buy. '+
        'You are not picking activities, and you are not picking times.')+
      beat(3,'Book your slots in the app','From four weeks before you arrive. '+
        'Three days earlier with the Early Access VIP Pass.')+
    '</ol>'+
    '<div class="tok-intro">'+
      '<p class="sec-note">Tokens pay for '+TOKEN_ACTIVITIES.length+' activities at '+resortName()+
        ', from '+r.lo+' token a go up to '+r.hi+'.</p>'+
      '<button type="button" class="tok-more tok-costs-link" id="tokCostsBtn" data-toklist '+
        'aria-haspopup="dialog">See activity costs</button>'+
    '</div>'+
  '</div>';
}

/* ---- V2: THE CUSTOM CHOOSER, BACK ON THE BLOCK (client, 24 Aug 2026).
   It lived in the activity costs modal's sticky footer from 21 Aug. The modal is read-only
   reference content now, so the one control that set a number could not stay in it: a stepper
   beside a list of activities is precisely the "am I booking these?" confusion the client asked
   us to remove. It returns as the disclosure it was before that move, below the packs and closed
   by default, so the packs stay the obvious path. Sarah's read is that a small proportion of
   guests want this, which is what a disclosure is for.

   TYPE OR STEP, both. The number input is the fast path for someone who already knows what they
   want; the stepper is for everyone else.

   NEITHER DRAFT CONTROL RE-RENDERS. This file's accepted lo-fi limitation is that a full render
   loses keyboard focus. That is survivable for a button and fatal for a text input: you could
   not type a second digit. So the draft lives in state._ownDraft, the panel updates itself in
   place, and only the commit button renders. ---- */
/* What the custom card says instead of repeating its own count. Three states, all computed:
   under a cliff, where more tokens cost less in total; a better rate within reach; or already
   on the best rate. Nothing here is prose for its own sake - every number comes from
   tokenNextBand(), which was already unit tested and until now unused on screen.
   LIFTED TO TOP LEVEL, 24 Aug 2026. It was declared INSIDE tokensCard(), so it was only
   reachable from there. Harmless while tokensCard() was the only caller; the moment ownLive()
   in the new custom chooser called it the whole section threw ReferenceError and rendered
   nothing. Caught by the v2 harness, not by reading the diff. */
function ownNote(n,nb){
  if(!nb) return '<span class="to-note is-best">Best rate you can get</span>';
  var more=nb.add+' more token'+(nb.add===1?'':'s');
  return nb.delta<0
    ? '<span class="to-note">'+more+' and you pay <b>'+gbp(-nb.delta)+' less</b> in total</span>'
    : '<span class="to-note">'+more+' drops you to <b>'+gbp(nb.rate)+' per token</b></span>';
}
function ownDraft(){
  if(state._ownDraft!==null&&state._ownDraft!==undefined) return state._ownDraft;
  /* SEEDED FROM THE GUIDE from 25-27 Aug; SUPERSEDED 27 Aug (Oliver, round 3): the bar opens
     on ZERO. Never from the booking either - a chosen pack's number would print its price a
     second time, breaking ONE PRICE FOR WHAT IS ON THE BOOKING (held since 21 Aug). At zero
     the figures ask for a number and the commit stays disabled until one is given. */
  return 0;
}
/* THE CUSTOM CARD'S INTERNALS (reshaped 25 Aug): the shared .pk-money price block at the same
   size as every pack, the saving as cash alone - the "against £x on resort" comparison came off
   at Oliver's ask; the struck resort price on the packs above already establishes the basis -
   and the band-cliff note, which is still the one fact a typed number cannot read off the packs. */
function ownLive(d){
  if(!d||d<1) return '<span class="ol-none">Choose how many tokens you want.</span>';
  var sv=tokenSaving(d);
  /* the hi-fi's order (27 Aug): the saving as a small line ABOVE the price, then the price with
     its rate, then the band-cliff note - still the one fact a typed number cannot read off the
     packs, so it stays even though the hi-fi does not draw it. */
  return (sv>0?'<span class="ol-save">Save '+gbp(sv)+'</span>'
             :'<span class="ol-save is-none">No saving at this size</span>')+
    '<div class="pk-money"><span class="pk-cost">'+gbp(d*tokenRate(d))+'</span>'+
    '<span class="pk-rate">'+gbp(tokenRate(d))+' a token</span></div>'+
    ownNote(d,tokenNextBand(d));
}
/* SAME LABEL AS THE PACKS (Oliver, 25 Aug): the count is already in the field beside it. */
function ownAddLabel(d){ return 'Add to booking'; }
/* THE PANEL RENDERS NOTHING WHILE IT IS CLOSED, and that is a rule rather than a saving.
   ONE PRICE FOR WHAT IS ON THE BOOKING has held since 21 Aug: whichever option owns the count
   states the price and nothing else does. The draft opens on the count already on the booking,
   so a panel that rendered its price while closed printed that figure a second time - GBP 70.20
   twice on a 12-token booking, once on the pack that owns it and once inside a hidden div. The
   empty div stays so aria-controls still points at a real element. */
/* SUPERSEDED 27 Aug by ownBar(): the standing B13 card with its typed field is replaced by the
   hi-fi's full-width CUSTOM bar below the grid. */
/* THE CUSTOM BAR (Oliver's hi-fi, 27 Aug). One full-width row under the packs, three states:
   CLOSED - "Custom / You choose", the best rate as a from-price, and one button that opens it.
   OPEN   - the draft: saving, price and rate, the band-cliff note, a stepper whose readout is
            a typeable field (type or step, both, as since 24 Aug), and Add to booking. Only
            the commit reaches state.book - the DMCC rule the whole section observes.
   ON     - a committed custom amount lives HERE now, not in a card above the packs: the same
            bar shows the booking's price, the amendable stepper (data-tokqty, the wiring the
            old tok-own card used), and "On your booking", which removes on tap like a pack.
   The ids (tokOwnNum, tokOwnLive) and data hooks are unchanged, so the typing, stepping and
   commit wiring carry over untouched. */
/* ONE ANATOMY, THREE STATES (Oliver, 27 Aug round 2): every state renders the same row -
   titles on the left, then a right-hand group of figures, an optional control, and a
   fixed-width button. The figures block is the same shape everywhere: a small line, the price
   at ONE size, the rate beside it. Nothing changes size between states. */
function ownFigures(small,cost,rate,note){
  return '<div class="own-live" id="tokOwnLive" aria-live="polite">'+
    '<span class="ol-save">'+small+'</span>'+
    '<div class="pk-money"><span class="pk-cost">'+cost+'</span>'+
      '<span class="pk-rate">'+rate+'</span></div>'+
    (note||'')+
  '</div>';
}
function ownBar(){
  var titles='<div class="pk-titles"><span class="pk-kicker">Custom</span>'+
    '<h4 class="pk-name">You choose</h4></div>';
  if(state._tokOwn && tokensTotal()>0){
    var n=tokensTotal(), sv=tokenSaving(n);
    return '<div class="own-bar is-on" id="tokOwnPanel">'+titles+
      ownFigures(sv>0?'Save '+gbp(sv):'On your booking',
        gbp(tokCost()), gbp(tokenRate(n))+' a token', ownNote(n,tokenNextBand(n)))+
      '<div class="own-actions">'+
        '<div class="own-ctl">'+stepper(n,'data-tokqty="1"','Tokens on your booking',n>=TOKEN_MAX,'quiet')+'</div>'+
        '<button type="button" class="pk-btn own-add" data-tokclear aria-pressed="true">'+
          '&#10003; On your booking</button>'+
      '</div>'+
    '</div>';
  }
  if(!state._ownOpen){
    /* the from-price is the grid's best rate, which only a big custom amount can reach - the
       one honest "from" on the screen, and the reason to open the bar at all */
    return '<div class="own-bar" id="tokOwnPanel">'+titles+
      ownFigures('<span class="of-kick">from</span>', gbp(tokenRate(TOKEN_MAX)), 'per token')+
      '<div class="own-actions">'+
        '<button type="button" class="pk-btn own-open" data-tokown aria-expanded="false" '+
          'aria-controls="tokOwnLive">Choose your tokens</button>'+
      '</div>'+
    '</div>';
  }
  var d=ownDraft();
  return '<div class="own-bar is-open" id="tokOwnPanel">'+titles+
    '<div class="own-live" id="tokOwnLive" aria-live="polite">'+ownLive(d)+'</div>'+
    '<div class="own-actions">'+
      '<div class="own-ctl"><div class="stepper quiet" data-ownstep role="group" aria-label="How many tokens">'+
        '<button type="button" class="step-btn" data-dir="-1" aria-label="Decrease, how many tokens"'+
          (d<=0?' aria-disabled="true"':'')+'>&minus;</button>'+
        '<input class="own-input" id="tokOwnNum" type="number" inputmode="numeric" min="0" '+
          'max="'+TOKEN_MAX+'" value="'+d+'" data-ownnum aria-label="How many tokens" '+
          'aria-describedby="tokOwnLive">'+
        '<button type="button" class="step-btn" data-dir="1" aria-label="Increase, how many tokens"'+
          (d>=TOKEN_MAX?' aria-disabled="true"':'')+'>+</button>'+
      '</div></div>'+
      '<button type="button" class="pk-btn own-add" data-ownadd'+(d>0?'':' aria-disabled="true"')+'>'+
        ownAddLabel(d)+'</button>'+
    '</div>'+
  '</div>';
}

/* THE HI-FI CARD (27 Aug): a header band carrying the count and the per-guest slice - the
   hi-fi colours the three bands; the lo-fi steps a grey - then name, persona copy (back from
   the explorations; the hi-fi reinstated it), price with its rate, the Best value chip on the
   cheapest rate, the save line, and the commit. */
function packCard(pk,idx){
  var tier=PACK_TIERS[idx], on=(!state._tokOwn && tokensTotal()===pk.n);
  /* earned, never asserted: the chip goes to the best rate on the ladder, and only if that
     size actually saves against the resort column */
  var best=tokenSaving(pk.n)>0 &&
    pk.rate===Math.min.apply(null,largePacks().map(function(p){ return p.rate; }));
  return '<div class="pk'+(on?' is-on':'')+'">'+
    '<div class="pk-band pk-band-'+idx+'">'+
      '<span class="pk-dots" aria-hidden="true">&#8759;</span>'+
      '<span class="pk-bandn"><b>'+pk.n+'</b> tokens</span>'+
      '<span class="pk-each">'+pk.each+' each</span>'+
    '</div>'+
    '<div class="pk-body">'+
      '<h4 class="pk-name">'+tier.name+'</h4>'+
      '<p class="pk-copy">'+tier.copy+'</p>'+
      '<div class="pk-money"><span class="pk-cost">'+gbp(pk.cost)+'</span>'+
        '<span class="pk-rate">'+gbp(pk.rate)+' a token</span>'+
        (best?'<span class="pk-best">Best value</span>':'')+'</div>'+
      packSaveRow(pk)+
      '<button type="button" class="pk-btn" data-tokpack="'+pk.n+'" aria-pressed="'+(on?'true':'false')+'">'+
        (on?'✓ On your booking':'Add to booking')+'</button>'+
    '</div></div>';
}

/* the section body, from the preview's render(). The card, the guide, the nudge, the custom
   stepper and the activity costs link, in that order. Data attributes are THIS file's
   (`data-tokpack`, `data-tokqty`, `data-toklist`) so the existing wiring and its assertions
   carry over unchanged; only the classes and the structure are the preview's. */
/* SUPERSEDED 27 Aug: the tok-own card above the grid is gone. A committed custom amount lives
   in the custom bar itself now (ownBar's ON state), so nothing sits above the first pack and
   the one-price rule holds with one fewer surface. */
function tokensCard(){
  /* the id stays on a plain wrapper so the nav, the harness and the shots keep their handle */
  return '<div class="tok-block" id="card-tokens">'+
    '<div class="pk-grid">'+largePacks().map(packCard).join('')+'</div>'+
    ownBar()+
    '</div>';
}

/* THE ACTIVITY COSTS MODAL, markup from the preview. Reference content, so it overlays rather
   than lengthening the section: bottom sheet on a phone, centred dialog on the wide frame.
   The focus, inert and Escape handling in renderSheet() below is this file's and is kept: the
   preview locks the scroller but does not make the booking behind the dialog inert. */
/* age bounds parsed from the published strings rather than duplicated into the data: "8+" is
   8 to 99, "5-7" is 5 to 7, "All" is everyone, "2.5-6" is 2.5 to 6. */
function ageRange(a){
  var t=String(a.ages).trim();
  if(/^all$/i.test(t)) return [0,99];
  var plus=t.match(/^([\d.]+)\+$/);        if(plus) return [parseFloat(plus[1]),99];
  var span=t.match(/^([\d.]+)\s*-\s*([\d.]+)$/); if(span) return [parseFloat(span[1]),parseFloat(span[2])];
  return [0,99];
}
/* AGE BRACKETS (Oliver, 21 Aug). These were Adults / Children / Toddlers, derived from the
   party, and they barely cut anything: almost every activity is an open-ended minimum like
   "5+", so "Children" filtered nothing at all. Real brackets ask the question a parent asks,
   which is what a five year old can actually do. */
var AGE_FILTERS=[
  { key:"all",   label:"All ages", lo:0,  hi:99 },
  { key:"2to4",  label:"2 to 4",   lo:2,  hi:4  },
  { key:"5to7",  label:"5 to 7",   lo:5,  hi:7  },
  { key:"8to11", label:"8 to 11",  lo:8,  hi:11 },
  { key:"12up",  label:"12+",      lo:12, hi:99 }
];
function ageFilter(key){
  for(var i=0;i<AGE_FILTERS.length;i++) if(AGE_FILTERS[i].key===key) return AGE_FILTERS[i];
  return AGE_FILTERS[0];
}
function suitsBand(a,key){
  if(key==="all") return true;
  var f=ageFilter(key), r=ageRange(a);
  return r[0]<=f.hi && r[1]>=f.lo;
}

/* THE ACTIVITY COSTS MODAL. It does two jobs since 21 Aug: it is where a guest finds out what a
   token is worth, and it is where they set their own number, in the sticky footer. Everything
   above the footer scrolls; the modal is capped so it never grows past the frame. */
/* THE MODAL IS BUILT FROM PARTS, so an open dialog can be UPDATED rather than replaced.
   Replacing it on every state change meant a fresh .modal and .modal-back element each time,
   and a fresh element restarts its CSS animation: the drawer slid up again on every stepper
   press on mobile, and the scrim faded from nothing on desktop. (Oliver, 21 Aug) */
/* the name is the biggest thing in the row and the token count the smallest: this is a
   reference list, not a price list. */
/* SUPERSEDED 24 Aug 2026: TAP TO ADD IS GONE, at the client's request, and tokRowLabel() and
   tokRowRight() went with it. Tap-to-add was added on 21 Aug so a tap added exactly what the row
   said it cost, one go of that activity's own unit. The maths was right and the affordance was
   the problem: a list of named activities with a + on every line reads as a booking screen, and
   guests not understanding that they are buying credit rather than booking slots is the client's
   single biggest complaint about tokens. So the dialog is now purely read-only reference: no
   plus, no count, no clear, no commit, and nothing inside it can change the booking.
   The custom chooser that shared its footer moved back onto the block - see ownBar(). */
function tokVisibleIdx(){
  var key=state._tokFilter||"all", out=[];
  ["play","resort"].forEach(function(v){
    TOKEN_ACTIVITIES.forEach(function(a,i){ if(a.venue===v&&suitsBand(a,key)) out.push(i); });
  });
  return out;
}
function tokActRow(a){
  return '<li class="ta-row"><div class="ta-line">'+
    '<span class="ta-main">'+
      '<span class="ta-name">'+a.name+'</span>'+
      '<span class="ta-meta">Ages '+a.ages+' &middot; per '+a.unit+'</span></span>'+
    '<span class="ta-cost">'+a.per+' token'+(a.per===1?'':'s')+'</span>'+
    '</div></li>';
}
function tokModalList(){
  var key=state._tokFilter||"all";
  function group(label,venue){

/* ============================================================ TOKENS SLIM (27 Aug 2026).
   The Paper V2 card, the approach chosen on the 27 Aug review. The whole section is ONE CARD:
   hero with a Tokens pill (arrows on the phone, no dots), "Save now, play later" and the body
   line INSIDE the card, the packs as radio rows carrying the per-token rate and the cash
   saving, a custom row with a stepper, and the price in the CARD footer - the selection's
   cost, rate and saving, or "From" the best rate while nothing is chosen. Rows are a DRAFT:
   only Add to booking reaches state.book.tokens, per the DMCC caution on pre-selection that
   the pack grid already observes. Sizes, rates and savings all come from tokenPacks() /
   tokenRate() / tokenSaving(), so this branch quotes the same grid as the other two. */
function slimSel(){
  if(state._slimSel!==null&&state._slimSel!==undefined) return state._slimSel;
  var n=tokensTotal();
  if(n<=0) return null;
  return (!state._tokOwn && PACK_SIZES.indexOf(n)>=0) ? n : "custom";
}
function slimN(){ return (state._slimN!==null&&state._slimN!==undefined) ? state._slimN : TOKEN_PER_GUEST*payGuests(); }
function slimCount(sel){ return sel==="custom" ? slimN() : (sel||0); }
function slimRow(pk){
  var on=slimSel()===pk.n;
  return '<button type="button" class="slim-row'+(on?' is-on':'')+'" data-slimsel="'+pk.n+'" '+
      'role="radio" aria-checked="'+(on?'true':'false')+'">'+
    '<span class="slim-dot" aria-hidden="true"></span>'+
    '<b>'+pk.n+' tokens</b>'+
    '<span class="slim-rate">'+gbp(pk.rate)+' each &middot; save '+gbp(tokenSaving(pk.n))+'</span>'+
  '</button>';
}
/* the custom row: the radio half is its own button so the stepper's buttons are not nested */
function slimCustomRow(){
  var on=slimSel()==="custom", d=slimN();
  return '<div class="slim-row is-custom'+(on?' is-on':'')+'">'+
    '<button type="button" class="slim-pick" data-slimsel="custom" role="radio" aria-checked="'+(on?'true':'false')+'">'+
      '<span class="slim-dot" aria-hidden="true"></span><b>Custom</b></button>'+
    stepper(d,'data-slimstep="1"','Custom tokens',d>=TOKEN_MAX,'quiet')+
  '</div>';
}
/* the card footer. Selected: cost, rate, saving, in the layout Oliver set in Paper (price row
   first, the demi saving line under it). Nothing selected: "From" the best per-token rate. */
function slimBar(){
  var sel=slimSel(), n=slimCount(sel);
  var committed = n>0 && tokensTotal()===n && (sel!=="custom" ? !state._tokOwn : state._tokOwn);
  var price;
  if(n>0){
    var sv=tokenSaving(n);
    price='<div class="co-priceblock"><span class="slim-money"><span class="co-price">'+gbp(n*tokenRate(n))+'</span>'+
      '<span class="co-pp">'+gbp(tokenRate(n))+' per token</span></span>'+
      (sv>0?'<span class="slim-save">you save '+gbp(sv)+' vs on resort</span>'
           :'<span class="slim-save is-none">no saving at this size</span>')+'</div>';
  } else {
    var best=Math.min.apply(null,tokenPacks().map(function(p){ return p.rate; }));
    price='<div class="co-priceblock"><span class="slim-money"><span class="co-price">From '+gbp(best)+'</span>'+
      '<span class="co-pp">per token</span></span>'+
      '<span class="slim-save">every pack beats the on-resort rate</span></div>';

  return '<div class="cbar slim-bar">'+price+
    addBtn(committed,'data-slimadd','Add to booking','On your booking',n<1)+'</div>';
}

/* APPROACH B: QUICK WINS, settled in phase4-tokens-quickwins-explorations.html over eleven

var QW_ART={

function qwArt(k){

/* ---- Check-in and check-out: one card, two options, mutually exclusive.
   Priced per unit, and each party has one unit, so this party's price is one unit's price.
   The blocked option stays visible and focusable with aria-disabled and an announced reason,
   which is the workstream convention (Phase 3 BBW section 6). Live uses a CSS pointer-events
   lockout that assistive tech cannot see; that is the thing being fixed. ---- */
/* The sub-line states the PER UNIT rate. It used to divide the unit price by that party's
   guest count, which printed five different per-person rates for one GBP 22 product across
   the 5-party preset (GBP 4.40 to GBP 7.33). A per-unit product states a per-unit price:
   dividing it invents a basis the product does not have. The per-person sub-line belongs
   only on the per-person cards, where it is the real rate. */
/* WHOLE-BOOKING CARD, so the hero is the TOTAL and the rate demotes to the sub-line - the rule
   stated at COST DISPLAY above. This read the per-unit rate as the hero until 21 Aug, which was
   invisible while every party block showed its own single unit and plainly wrong once the
   booking became one card: two units read "GBP 22" when the guest pays GBP 44. The sub-line
   stays PER UNIT and is never divided by guests. */
function coOption(o){
  var u=nUnits(), total=o.per*u;
  return '<div class="checkin-opt'+(o.on?' is-added':'')+'">'+
    '<div class="co-info"><b>'+o.title+'</b><span class="row-sub">'+o.desc+'</span></div>'+
    '<div class="cbar sm"><div class="co-priceblock"><span class="co-price">'+gbp(total)+'</span>'+
    '<span class="co-pp">'+gbp(o.per)+' per unit'+(u>1?' \u00d7 '+u+' units':'')+'</span></div>'+
    addBtn(o.on,'data-book="'+o.key+'"','Add to booking','Added to booking')+'</div></div>';
}
function xCheckin(i){
  var anyOn=state.book.early||state.book.late;
  /* Neither option is disabled when the other is on (Oliver, 21 Aug): clicking the opposite
     one simply deselects the one that is selected. The exclusivity lives in the click handler,
     which clears the other key, so the controls stay live and the swap is one tap. */
  var early=coOption({ key:"early", on:state.book.early, per:PRICE.earlyPerUnit,
    title:"Arrive from 1pm", desc:"Start your break 2 hours earlier. Standard check-in is 3pm." });
  var late=coOption({ key:"late", on:state.book.late, per:PRICE.latePerUnit,
    title:"Leave at 12pm", desc:"An extra 2 hours on your last day. Standard check-out is 10am." });
  var note = multi()
    ? '<div class="allnote">Charged per unit and applied to the whole booking, so adding it here adds it for all '+nParties()+' parties. The price shown is '+partyLabel(i)+'\'s unit.</div>'
    : '';
  return '<div class="card xcard'+(anyOn?' is-added':'')+'" id="card-checkin-'+i+'">'+
    '<div class="xc-body"><div class="xc-head"><span class="xc-ico" aria-hidden="true">◑</span><h3>Extend your stay</h3>'+
    scopeTag(multi()?"All parties":"Whole booking")+'</div>'+
    '<p class="desc">Add one of these, not both. Your accommodation needs a cleaning turnaround between guests.</p>'+
    note+
    '<div class="checkin-opts">'+early+late+'</div></div></div>';
}

/* the products a party shows, in order, filtered for relevance. Big Top Circus only appears
   on summer holiday breaks and Spa only at Bognor. This is the direct fix for P0's finding
   about a spa tab showing where there is no spa.

   ONE ORDER, THREE CONSUMERS. Party blocks, the single-party sections and the nav all read
   this list, so the running order and the relevance filter cannot drift apart between them.
   Tokens are NOT in here: they are a booking-level purchase priced in bands, so they render
   once at the top of the step rather than inside every party block. */
var PRODUCT_ORDER=[
  { id:"vip", group:"pass",     label:"VIP Pass",         when:null,         build:xVip,
    has:function(i){ return state.book.vip; } },
  { id:"aa", group:"pass",      label:"All Action",       when:null,         build:xAllAction,
    has:function(i){ return px(i).aa>0; } },
  { id:"cir", group:"pass",     label:"Big Top Circus",   when:circusActive, build:xCircus,
    has:function(i){ return px(i).cir>0; } },
  { id:"spa", group:"extra",     label:"Spa",              when:spaActive,    build:xSpa,

  { id:"checkin", group:"extra", label:"Extend your stay", when:null,         build:xCheckin,
    has:function(i){ return state.book.early||state.book.late; } },
  { id:"tow", group:"extra",     label:"Towels",           when:null,         build:xTowels,
    has:function(i){ return px(i).tow>0; } }
];
function activeProducts(){ return PRODUCT_ORDER.filter(function(p){ return !p.when||p.when(); }); }
/* PASSES AND EXTRAS ARE TWO SECTIONS (Oliver, 21 Aug), split out of the single "Extras & passes"
   block. PRODUCT_ORDER.group is the only place the split is declared, so the sections, the

/* one breakdown line: a bold group label and value plus optional [label, value] sub-lines,

function breakdownRows(){

  var c=computeAll(), a=accom(), rows='';

  if(c.vip>0) exSubs.push(["Early Access VIP Pass",gbp(c.vip)]);
  if(c.allAction>0) exSubs.push(["All Action Pass",gbp(c.allAction)]);
  if(c.circus>0) exSubs.push(["Big Top Circus",gbp(c.circus)]);

     verified was-price, and DMCC caution says do not aggregate until they do. */

/* Matched to phase2-dining-extras-bbw-hifi.html's ovBreakdown() (Oliver, 21 Aug): the block

/* ============================================================ NAV
   Single party: product anchors, which is what the live tabs do. Multi-party: party anchors,
   because a product anchor would point at five places at once. The parties layout carries the
   structure, so the nav follows it. */
function currentNav(){
  var out=[];
  /* tokens first at Bognor, matching the live running order, and in both layouts because the
     purchase is booking-level rather than per party. */
  if(tokensActive()) out.push({id:"tokens",label:"Tokens"});
  /* same list, same order, same relevance filter as the sections themselves */
  activeProducts().forEach(function(p){ out.push({id:p.id,label:p.label}); });
  out.push({id:"donation",label:"Donation"});
  out.push({id:"overview",label:"Your booking"});
  out.forEach(function(n){ n.covers=[n.id]; });
  return state.device==="mobile" ? groupNavForMobile(out) : out;
}
/* MOBILE NAV, AT MOST FOUR PILLS (Oliver, 21 Aug). Eight product anchors put 415px of the row
   off-screen at 390px, measured - hiding anchors is the thing the grouping exists to stop.
   Same idea as the BBW hi-fi's NAV_MOBILE, but built from the live product list rather than
   hard-coded, so a product that switches on by resort or break type is grouped, never dropped.
   A group pill jumps to the first section it covers and lights up for any of them. */
function groupNavForMobile(full){
  var id=function(n){ return n.id; };
  var isPass={}; productsIn("pass").forEach(function(p){ isPass[p.id]=1; });
  var tokens=full.filter(function(n){ return n.id==="tokens"; });
  var passes=full.filter(function(n){ return isPass[n.id]; });
  var extras=full.filter(function(n){ return !isPass[n.id]&&n.id!=="tokens"&&n.id!=="overview"; });
  var booking=full.filter(function(n){ return n.id==="overview"; });
  var out=tokens.slice();
  if(!tokens.length&&passes.length>1){
    /* no Tokens pill at Minehead, so the fourth slot goes back to naming the two passes */
    out.push({id:passes[0].id,label:passes[0].label,covers:[passes[0].id]});
    out.push({id:passes[1].id,label:passes[1].label,covers:passes.slice(1).map(id)});
  } else if(passes.length){
    /* the group pill now targets the real section heading, not the first card in it */
    out.push({id:"passes",label:passes.length>1?"Passes":passes[0].label,
              covers:["passes"].concat(passes.map(id))});
  }
  if(extras.length) out.push({id:"extras",label:"Extras",covers:["extras"].concat(extras.map(id))});
  return out.concat(booking);
}
/* both branches count off the same relevance-filtered product list, so a product added to
   PRODUCT_ORDER is picked up by the ticks without touching this function. */
/* a pill is full when everything it covers is added, partial when only some of it is */
function navTick(n){
  var ids=(typeof n==='string')?[n]:(n.covers||[n.id]), got=0, count=0;
  ids.forEach(function(id){
    if(id==="overview") return;
    count++;
    if(id==="tokens"){ if(tokensTotal()>0) got++; return; }
    if(id==="donation"){ if(state.book.donation) got++; return; }
    var prod=null; activeProducts().forEach(function(p){ if(p.id===id) prod=p; });
    if(prod&&prod.has(0)) got++;
  });
  if(!count||!got) return 'none';
  return got>=count?'full':'partial';
}
/* which pill represents a section at the current breakpoint */
function navPillFor(sec){
  var hit=null;
  currentNav().forEach(function(n){ if((n.covers||[n.id]).indexOf(sec)>=0) hit=n.id; });
  return hit;
}
function buildNav(){
  var el=document.getElementById('sectionNav');
  el.innerHTML=currentNav().map(function(n){
    var t=navTick(n), active=state._activeSec===n.id;
    var tcls=t==='full'?' added':(t==='partial'?' partial':'');
    var ttl=t==='full'?' title="Added"':(t==='partial'?' title="Some added"':'');
    return '<button type="button" class="nav-item'+(active?' is-active':'')+tcls+'" data-nav="'+n.id+'"'+ttl+'>'+
      '<span class="nav-tick" aria-hidden="true">✓</span>'+n.label+'</button>';
  }).join('');
  el.querySelectorAll('[data-nav]').forEach(function(b){
    b.addEventListener('click',function(){ gotoSec(b.getAttribute('data-nav')); });
  });
  updateNavAffordance();
}
function setActiveNav(sec){ var id=navPillFor(sec)||sec; if(state._activeSec===id) return; state._activeSec=id;
  document.querySelectorAll('#sectionNav .nav-item').forEach(function(b){ b.classList.toggle('is-active',b.getAttribute('data-nav')===id); }); }
function gotoSec(id){
  var el=document.getElementById('sec-'+id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}
/* nav overflow affordance: edge fades plus chevron scrollers, from the BBW lofi */
function updateNavAffordance(){
  var nav=document.getElementById('sectionNav'), wrap=document.getElementById('navWrap');
  if(!nav||!wrap) return;
  /* is-over reserves the two chevron tracks and is set from overflow alone, so it does not
     change while scrolling. has-left / has-right then toggle the fades and the chevrons'
     visibility within those tracks. Measure overflow first, then set is-over: the tracks it
     adds only ever narrow the scroller, so an overflowing nav cannot flip itself back. */
  var max=nav.scrollWidth-nav.clientWidth, overflow=max>1;
  wrap.classList.toggle('is-over', overflow);
  max=nav.scrollWidth-nav.clientWidth;   /* re-measure once the tracks are in */
  wrap.classList.toggle('has-left', overflow && nav.scrollLeft>1);
  wrap.classList.toggle('has-right', overflow && nav.scrollLeft<max-1);
}
function scrollNav(dir){ var nav=document.getElementById('sectionNav'); if(nav) nav.scrollBy({left:dir*(nav.clientWidth/2),behavior:'smooth'}); }
(function(){
  var nav=document.getElementById('sectionNav');
  var cl=document.getElementById('navChevLeft'), cr=document.getElementById('navChevRight');
  if(cl) cl.addEventListener('click',function(){ scrollNav(-1); });
  if(cr) cr.addEventListener('click',function(){ scrollNav(1); });
  if(nav) nav.addEventListener('scroll',updateNavAffordance,{passive:true});
  window.addEventListener('resize',updateNavAffordance);
})();

/* ============================================================ RENDER */
var content=document.getElementById('content');
var scrollEl=document.getElementById('scroll');
function render(){
  var keep=scrollEl.scrollTop;
  content.innerHTML=tokensSection()+sectionPasses()+sectionExtras()+sectionDonation()+sectionOverview();
  wireContent();
  buildNav();
  recompute();
  scrollEl.scrollTop=keep;
  renderSheet();
}
/* The modal, and the two things that make it a real one rather than a box on top: focus moves
   into the dialog on open and back to the trigger on close, and everything behind it is set
   inert, so tab and a screen reader cursor cannot walk around behind an open dialog. The BBW
   precedent this pattern comes from does neither for its sheet. */
/* closing the drawer. The exit animation has to play before the DOM goes, so the element is
   marked and the state change waits for it. Reduced motion and the wide frame close at once. */
function closeTokModal(){
  var host=document.getElementById('sheetHost');
  var mo=host&&host.querySelector&&host.querySelector('.modal');
  var back=host&&host.querySelector&&host.querySelector('.modal-back');
  var reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  function done(){ state._tokList=false; announce("Activity costs closed"); render(); }
  if(!mo||reduce||state.device!=="mobile"){ done(); return; }
  if(mo.classList) mo.classList.add('is-closing');
  if(back&&back.classList) back.classList.add('is-closing');
  setTimeout(done,200);
}
/* UPDATE AN OPEN DIALOG IN PLACE. Nothing here replaces an element that carries a listener or
   an animation: the chips get an attribute, the list is inert markup, the price block is text,
   and the stepper keeps its own buttons and only has its readout and disabled states set.
   That is what stops the drawer re-sliding and the scrim re-fading on every press, and it also
   means focus is never lost, so no focus needs restoring. */
function syncTokModal(){
  var host=document.getElementById('sheetHost');
  var mo=host&&host.querySelector&&host.querySelector('.modal');
  if(!mo) return false;
  var key=state._tokFilter||"all";
  mo.querySelectorAll('[data-tokfilter]').forEach(function(b){
    b.setAttribute('aria-pressed', b.getAttribute('data-tokfilter')===key ? 'true' : 'false');
  });
  /* SIMPLER SINCE 24 Aug. The rows are inert, so rebuilding the list cannot pull a control out
     from under a finger or lose anyone's focus, and the only thing that changes the visible set
     is the filter. The set it last rendered is stamped on the list so a press on the chip that
     is already pressed does not rebuild for nothing. */
  var list=mo.querySelector('#tokModalList');
  if(list){
    var want=tokVisibleIdx().join(',');
    if(list.getAttribute('data-set')!==want){
      list.innerHTML=tokModalList(); list.setAttribute('data-set',want);
    }
  }
  /* SUPERSEDED 27 Aug: the footer is gone, so there is no count to keep in step - nothing
     else in the dialog reads state.book. */
  return true;
}
function renderSheet(){
  var host=document.getElementById('sheetHost');
  if(!host) return;
  /* already open and already mounted: update it, do not rebuild it */
  if(state._tokList && host.querySelector && host.querySelector('.modal')){ syncTokModal(); return; }
  host.innerHTML=tokenModal();
  var open=!!state._tokList;
  if(scrollEl&&scrollEl.classList) scrollEl.classList.toggle('is-locked',open);
  var frame=document.querySelector('.frame');
  if(frame&&frame.children) [].slice.call(frame.children).forEach(function(el){
    if(el.id!=='sheetHost') el.inert=open;
  });
  if(open){
    /* focus the dialog once, on mount. preventScroll matters: without it the browser scrolls
       the document to bring the dialog into view and lifts the whole device frame. */
    var sh=document.getElementById('tokSheet');
    if(sh&&sh.focus) sh.focus({preventScroll:true});
  } else if(state._sheetWas){
    var trig=document.querySelector('[data-toklist]');
    if(trig&&trig.focus) trig.focus({preventScroll:true});
  }
  state._sheetWas=open;
}
function recompute(){
  var c=computeAll();
  document.getElementById('totalFig').innerHTML=gbp(c.grand);
  document.getElementById('guestSumm').textContent=totalGuests()+" guests"+(multi()?", "+nParties()+" parties":"");
  document.getElementById('resortSumm').textContent=resortName();
  /* PARITY WITH LIVE (Oliver, 20 Aug). The live bar carries one fixed label and one fixed line
     of copy, so the contextual continue ("Continue without extras" / "Continue to guest
     details") and the contextual note have both gone. If a contextual label is ever wanted
     back, this is where it goes.
     Nothing writes to summaryInner any more either - the footer panel has gone, and
     breakdownRows() still renders into the Your booking section via the overview. */
  var navById={}; currentNav().forEach(function(n){ navById[n.id]=n; });
  document.querySelectorAll('#sectionNav .nav-item').forEach(function(b){
    var t=navTick(navById[b.getAttribute('data-nav')]||b.getAttribute('data-nav'));
    b.classList.toggle('added',t==='full'); b.classList.toggle('partial',t==='partial');
  });
}

/* ============================================================ WIRING */
var NOUN={aa:"All Action Pass",cir:"Big Top Circus",spa:"Spa Experience",tow:"Towel Pack"};
var UNITNOUN={aa:"guest",cir:"guest",spa:"guest",tow:"pack"};
function maxFor(key,i){ var p=parties()[i]; return key==="tow"?pGuests(p):pPay(p); }

function wireContent(){
  content.querySelectorAll('[data-more]').forEach(function(b){
    b.addEventListener('click',function(e){ e.stopPropagation();
      var d=document.getElementById('more-'+b.getAttribute('data-more')); if(!d) return;
      var open=d.classList.toggle('open');
      b.textContent=open?'Read less':'Read more';
      b.setAttribute('aria-expanded',open?'true':'false'); });
  });
  /* token packs: one tap sets the booking's token count, and the footer total moves with it.
     Never pre-selected, per the DMCC caution on pre-ticked paid add-ons in the review. */
  content.querySelectorAll('[data-tokpack]').forEach(function(b){
    b.addEventListener('click',function(){
      var n=parseInt(b.getAttribute('data-tokpack'),10);
      state.book.tokens=(state.book.tokens===n)?0:n; state._tokOwn=false;
      /* taking the pack path abandons the draft, so the panel does not sit open underneath
         contradicting what is now on the booking */
      state._ownOpen=false; state._ownDraft=null;
      announce(state.book.tokens
        ? (n+" tokens added, "+gbp(tokCost())+", "+gbp(tokenRate(n))+" per token")
        : "Tokens removed");
      render(); });
  });
  content.querySelectorAll('.stepper[data-tokqty]').forEach(function(st){
    st.querySelectorAll('.step-btn').forEach(function(btn){
      btn.addEventListener('click',function(){
        var dir=parseInt(btn.getAttribute('data-dir'),10);
        var cur=state.book.tokens||0, next=Math.min(TOKEN_MAX,Math.max(0,cur+dir));
        if(next===cur){ announce(dir>0?("Tokens are capped at "+TOKEN_MAX):"No tokens on the booking"); return; }
        var before=tokenRate(cur||1);
        state.book.tokens=next; state._tokOwn=next>0;
        var after=tokenRate(next);
        announce(next+" token"+(next===1?"":"s")+", "+gbp(tokCost())+
          (next>0&&after!==before?(", the rate is now "+gbp(after)+" per token"):""));
        render(); });
    });
  });
  content.querySelectorAll('[data-tokclear]').forEach(function(b){
    b.addEventListener('click',function(){ state.book.tokens=0; state._tokOwn=false; announce("Tokens removed"); render(); });
  });
  /* opens the activity costs modal. It used to expand the card in place, which added about
     300px to a step the review measured at 10,874px. (user, 20 Aug) */
  /* THE CUSTOM CHOOSER (client, 24 Aug). Three controls, and only the last of them renders.
     BUG FIXED ON THE WAY BACK IN: this handler toggled state._tokOwn, which is PROVENANCE - the
     flag that decides whether a pack or the guest owns the count. Nothing had rendered
     data-tokown since 21 Aug so it never fired, but wired to the disclosure it would have
     flipped the meaning of the count on every open. Open state is its own flag now. */
  content.querySelectorAll('[data-tokown]').forEach(function(b){
    b.addEventListener('click',function(){
      state._ownOpen=!state._ownOpen;
      /* reopening starts from what is on the booking rather than the last abandoned draft */
      if(state._ownOpen) state._ownDraft=null;
      announce(state._ownOpen?"Choose your own amount, open":"Choose your own amount, closed");
      render(); });
  });
  /* IN-PLACE, NO RENDER. See the note on ownBar(): a full render loses keyboard focus, which
     would make the number input impossible to type a second digit into. Both draft controls
     write state._ownDraft and then repaint the three things that depend on it. */
  function paintOwn(d){
    state._ownDraft=d;
    var live=document.getElementById('tokOwnLive');
    if(live) live.innerHTML=ownLive(d);
    var add=document.querySelector('[data-ownadd]');
    if(add){
      add.textContent=ownAddLabel(d);
      if(d>0) add.removeAttribute('aria-disabled'); else add.setAttribute('aria-disabled','true');
    }
    var st=document.querySelector('.stepper[data-ownstep]');
    if(st){
      /* no .qty to update: the input inside the control IS the readout. Its value is written by
         whichever control changed it - the field by the guest, the buttons by their handler -
         so paintOwn only has to keep the two buttons' limits honest. */
      var less=st.querySelector('.step-btn[data-dir="-1"]'), more=st.querySelector('.step-btn[data-dir="1"]');
      if(less){ if(d<=0) less.setAttribute('aria-disabled','true'); else less.removeAttribute('aria-disabled'); }
      if(more){ if(d>=TOKEN_MAX) more.setAttribute('aria-disabled','true'); else more.removeAttribute('aria-disabled'); }
    }
  }
  content.querySelectorAll('[data-ownnum]').forEach(function(inp){
    inp.addEventListener('input',function(){
      /* an empty field or junk reads as 0, which ownLive() answers with a prompt rather than a
         price, and which disables the commit. The field is NOT rewritten while it is being
         typed into: forcing the value back would fight the caret. */
      var v=parseInt(inp.value,10);
      if(isNaN(v)||v<0) v=0;
      if(v>TOKEN_MAX){ v=TOKEN_MAX; inp.value=v; }
      paintOwn(v); });
  });
  content.querySelectorAll('.stepper[data-ownstep]').forEach(function(st){
    st.querySelectorAll('.step-btn').forEach(function(btn){
      btn.addEventListener('click',function(){
        var dir=parseInt(btn.getAttribute('data-dir'),10);
        var cur=ownDraft(), next=Math.min(TOKEN_MAX,Math.max(0,cur+dir));
        if(next===cur){ announce(dir>0?("Tokens are capped at "+TOKEN_MAX):"None chosen"); return; }
        var inp=document.getElementById('tokOwnNum');
        if(inp) inp.value=next;
        paintOwn(next);
        announce(next+" token"+(next===1?"":"s")+", "+gbp(next*tokenRate(next))); });
    });
  });
  /* the commit, and the ONLY thing in the panel that reaches the booking. _tokOwn goes true
     here: the count is the guest's own from now on, which is what keeps the amendable card
     above the packs rather than lighting up whichever pack happens to match. */
  content.querySelectorAll('[data-ownadd]').forEach(function(b){
    b.addEventListener('click',function(){
      if(b.getAttribute('aria-disabled')==='true'){ announce("Choose how many tokens first"); return; }
      var d=ownDraft();
      state.book.tokens=d; state._tokOwn=true; state._ownOpen=false; state._ownDraft=null;
      announce(d+" token"+(d===1?"":"s")+" added, "+gbp(tokCost())+", "+gbp(tokenRate(d))+" per token");
      render(); });
  });
  /* SLIM approach (27 Aug): rows are a draft, the card footer prices the draft, and only
     Add to booking reaches state.book.tokens. All three selectors match nothing unless the
     slim branch rendered, so this wiring is inert under the other two approaches. */
  content.querySelectorAll('[data-slimsel]').forEach(function(b){
    b.addEventListener('click',function(){
      var v=b.getAttribute('data-slimsel');
      state._slimSel = v==="custom" ? "custom" : parseInt(v,10);
      var n=slimCount(state._slimSel);
      announce(n>0 ? (n+" tokens selected, "+gbp(n*tokenRate(n))+", not yet on your booking")
                   : "Choose how many tokens");
      render(); });
  });
  content.querySelectorAll('.stepper[data-slimstep]').forEach(function(st){
    st.querySelectorAll('.step-btn').forEach(function(btn){
      btn.addEventListener('click',function(){
        var dir=parseInt(btn.getAttribute('data-dir'),10);
        var cur=slimN(), next=Math.min(TOKEN_MAX,Math.max(0,cur+dir));
        if(next===cur){ announce(dir>0?("Tokens are capped at "+TOKEN_MAX):"None chosen"); return; }
        state._slimN=next; state._slimSel="custom";
        announce(next+" token"+(next===1?"":"s")+", "+gbp(next*tokenRate(next)));
        render(); });
    });
  });
  /* the commit. Clicking while the selection is already ON the booking removes it, the same
     toggle the pack grid's data-tokpack buttons have always had. */
  content.querySelectorAll('[data-slimadd]').forEach(function(b){
    b.addEventListener('click',function(){
      if(b.getAttribute('aria-disabled')==='true'){ announce("Choose how many tokens first"); return; }
      var sel=slimSel(), n=slimCount(sel);
      if(tokensTotal()===n && n>0 && (sel!=="custom" ? !state._tokOwn : state._tokOwn)){
        state.book.tokens=0; state._tokOwn=false; state._slimSel=null;
        announce("Tokens removed");
      } else {
        state.book.tokens=n; state._tokOwn=(sel==="custom");
        announce(n+" token"+(n===1?"":"s")+" added, "+gbp(tokCost())+", "+gbp(tokenRate(n))+" per token");
      }
      render(); });
  });
  /* QUICK WINS wiring (16 Sep). Selectors match nothing unless that branch rendered. The
     field repaints #qwDyn only - never itself - so typing keeps focus and caret; the field is
     not rewritten while typed into except to clamp (the ownnum convention). */
  content.querySelectorAll('#qwNum').forEach(function(inp){
    inp.addEventListener('input',function(){
      var v=parseInt(inp.value.replace(/[^\d]/g,''),10);
      if(isNaN(v)||v<0) v=0;
      if(v>TOKEN_MAX){ v=TOKEN_MAX; inp.value=v; }
      state._qwN=v;
      var dyn=document.getElementById('qwDyn');
      if(dyn) dyn.innerHTML=qwBuyDyn();
      announce(v>0 ? (v+" token"+(v===1?"":"s")+", "+gbp(v*tokenRate(v))) : "No tokens chosen");
    });
    /* a click on the field's padding or suffix should land in the input */
    inp.closest('.qw-field').addEventListener('click',function(e){ if(e.target!==inp) inp.focus(); });
  });
  /* the commit and remove are DELEGATED from the panel, not wired per button: typing repaints
     #qwDyn, which rebuilds both buttons, and a listener wired to the old node would die with
     it - the add button would go silently dead after the first keystroke. */
  content.querySelectorAll('.qw-panel').forEach(function(p){
    p.addEventListener('click',function(e){
      var add=e.target.closest('[data-qwadd]');
      if(add){
        if(add.getAttribute('aria-disabled')==='true'){ announce("Choose how many tokens first"); return; }
        var n=state._qwN;
        if(n<1 || (tokensTotal()===n)) return;  /* nothing chosen, or already on the booking */
        state.book.tokens=n; state._tokOwn=true;
        announce(n+" token"+(n===1?"":"s")+" added, "+gbp(tokCost())+", "+gbp(tokenRate(n))+" per token");
        render(); return;
      }
      if(e.target.closest('[data-qwremove]')){
        state.book.tokens=0; state._tokOwn=false;
        announce("Tokens removed");
        render();
      }
    });
  });
  content.querySelectorAll('[data-qwmore]').forEach(function(b){
    b.addEventListener('click',function(){
      state._qwShown=Math.min(state._qwShown+qwPageSize(),TOKEN_ACTIVITIES.length);
      announce("Showing "+state._qwShown+" of "+TOKEN_ACTIVITIES.length+" activities");
      render(); });
  });
  /* the mobile hero carousel: wrap-around, full render per the file's accepted limitation */
  content.querySelectorAll('[data-heroarrow]').forEach(function(b){
    b.addEventListener('click',function(){
      var dir=parseInt(b.getAttribute('data-heroarrow'),10);
      state._heroIdx=(state._heroIdx+dir+3)%3;
      announce("Activity photo "+(state._heroIdx+1)+" of 3");
      render(); });
  });
  content.querySelectorAll('[data-toklist]').forEach(function(b){
    b.addEventListener('click',function(){
      state._tokList=true;
      announce("What tokens buy, "+TOKEN_ACTIVITIES.length+" activities");
      render(); });
  });
  content.querySelectorAll('.stepper[data-step]').forEach(function(st){
    var key=st.getAttribute('data-step'), i=parseInt(st.getAttribute('data-party'),10);
    st.querySelectorAll('.step-btn').forEach(function(btn){
      btn.addEventListener('click',function(){
        var dir=parseInt(btn.getAttribute('data-dir'),10), max=maxFor(key,i), e=px(i);
        var next=Math.min(max,Math.max(0,e[key]+dir));
        if(next===e[key]){
          announce(dir>0 ? (NOUN[key]+" is already added for everyone in "+partyLabel(i))
                         : (NOUN[key]+" is not on "+partyLabel(i)));
          return;
        }
        e[key]=next;
        announce(NOUN[key]+", "+partyLabel(i)+", "+next+" "+UNITNOUN[key]+(next===1?"":"s"));
        render(); });
    });
  });
  content.querySelectorAll('[data-all]').forEach(function(b){
    b.addEventListener('click',function(){
      var key=b.getAttribute('data-all'), i=parseInt(b.getAttribute('data-party'),10);
      var max=maxFor(key,i), e=px(i);
      e[key]=(e[key]>=max?0:max);
      announce(NOUN[key]+", "+partyLabel(i)+", "+e[key]+" "+UNITNOUN[key]+(e[key]===1?"":"s"));
      render(); });
  });
  /* whole-booking toggles. The check-in pair clears its partner rather than stacking. */
  content.querySelectorAll('[data-book]').forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.getAttribute('data-book');
      state.book[k]=!state.book[k];
      if(k==="early"&&state.book.early) state.book.late=false;
      if(k==="late"&&state.book.late)   state.book.early=false;
      var names={vip:"Early Access VIP Pass",early:"Early check-in",late:"Late check-out",
                 donation:"Donation",roomPick:"Room picker"};
      var scope=(k==="vip"||k==="early"||k==="late")&&multi()?" for all "+nParties()+" parties":"";
      announce((state.book[k]?"Added ":"Removed ")+names[k]+scope);
      render(); });
  });
  content.querySelectorAll('[data-summary-toggle]').forEach(function(b){
    b.addEventListener('click',function(){
      state._summaryOpen=!(state._summaryOpen!==false);
      announce(state._summaryOpen?"Your booking expanded":"Your booking collapsed");
      render(); });
  });
}



/* ============================================================ SCROLL-SPY */
function onScroll(){
  var top=scrollEl.getBoundingClientRect().top, secs=content.querySelectorAll('[data-sec]'), cur=null;
  secs.forEach(function(s){ if(s.getBoundingClientRect().top-top<=110) cur=s; });
  if(cur) setActiveNav(cur.getAttribute('data-sec'));
}
scrollEl.addEventListener('scroll',onScroll,{passive:true});

/* ============================================================ DEV CONTROLS */
/* null-safe: p5 can still be set programmatically though its button is gone, and setPreset
   presses every booking button. Without the guard that would throw on the real page. */
function press(id,on){ var el=document.getElementById(id); if(el) el.setAttribute('aria-pressed',on?'true':'false'); }
function clampAll(){
  for(var i=0;i<nParties();i++){
    var e=px(i);
    e.aa=Math.min(e.aa,maxFor('aa',i)); e.cir=Math.min(e.cir,maxFor('cir',i));
    e.spa=Math.min(e.spa,maxFor('spa',i)); e.tow=Math.min(e.tow,maxFor('tow',i));
  }
}
function setPreset(id){
  state.presetId=id; resetParties();
  press('bkP1',id==="p1"); press('bkP2',id==="p2"); press('bkP5',id==="p5");
  state._activeSec=null; render();
}
function setResort(r){ state.resort=r;
  if(!spaActive()) for(var i=0;i<nParties();i++) px(i).spa=0;
  if(!tokensActive()){ state.book.tokens=0; state._tokOwn=false; state._ownOpen=false; state._ownDraft=null; }
  press('rsMine',r==="minehead"); press('rsBognor',r==="bognor"); render(); }
function setBreak(b){ state.breakType=b;
  if(!circusActive()) for(var i=0;i<nParties();i++) px(i).cir=0;
  press('brTerm',b==="term"); press('brSummer',b==="summer"); render(); }
/* V2. Switching approach replaces the whole tokens section, so the scroll-spy's cached section
   is stale - clear it and let render() rebuild the nav, as setPreset() does. Token state is
   left alone deliberately: carrying the count across the toggle is how you compare the two
   approaches on the same booking. */
function setTokenApproach(a){ state.tokenApproach=a;
  press('tkSlim',a==="slim"); press('tkPacks',a==="packs"); press('tkCurrent',a==="current");
  state._activeSec=null; render(); }
function setDevice(d){ state.device=d;
  document.getElementById('rootToggleHost').setAttribute('data-device',d);
  document.getElementById('deviceHost').setAttribute('data-device',d);
  press('dvMobile',d==="mobile"); press('dvDesktop',d==="desktop");
  /* the quick-wins guide pages 4 on mobile, 6 on desktop; each device starts at its own size.
     Only that branch's markup depends on the device, so only it pays for a re-render here. */
  state._qwShown=qwPageSize();
  if(state.tokenApproach==="current") render();
  /* The nav differs by breakpoint since 21 Aug: granular product anchors on desktop, four
     grouped pills on mobile. So switching device has to REBUILD it, not just re-measure the
     overflow. This only re-measured, which left whichever nav was built at load - mobile, the
     default - showing at both sizes. buildNav() ends by calling updateNavAffordance(). */
  buildNav(); onScroll(); }

document.getElementById('bkP1').addEventListener('click',function(){ setPreset("p1"); });
document.getElementById('bkP2').addEventListener('click',function(){ setPreset("p2"); });
/* Escape closes the activity costs modal, as the BBW sheet does. Registered once here rather
   than per render, so it survives the innerHTML rebuild. */
if(document.addEventListener) document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&state._tokList){ closeTokModal(); }
});
/* TAP TO ADD, delegated and attached ONCE. #sheetHost itself is never replaced, only its
   contents, so attaching this per open stacked one listener per open and a single tap fired as
   many times as the dialog had been opened. Delegation also means it survives the in-place row
   updates without needing to be re-bound. */
/* EVERY CONTROL IN THE DIALOG IS DELEGATED, from one listener attached once to #sheetHost.
   Two reasons. #sheetHost is never replaced, only its contents, so per-open binding stacked a
   listener per open and a single tap fired as many times as the dialog had been opened. And
   delegation means syncTokModal() can rewrite any part of the dialog, including the footer
   actions, without a control going dead. */
(function(){
  var host=document.getElementById('sheetHost');
  if(!host||!host.addEventListener) return;
  host.addEventListener('click',function(e){
    var el=e.target; if(!el||!el.closest) return;

    /* the backdrop, but only when the backdrop itself was hit */
    if(el.matches&&el.matches('[data-scrim]')){ closeTokModal(); return; }
    if(el.closest('[data-sheetclose]')){ closeTokModal(); return; }

    /* THE ONLY CONTROL LEFT IN HERE IS THE AGE FILTER (client, 24 Aug). Clear all, the footer
       stepper and tap-to-add have all gone: the dialog is read-only reference and nothing inside
       it may write to state.book. If a control is ever added back it belongs above this line,
       and the read-only assertions in the harness should be repointed rather than removed. */
    var chip=el.closest('[data-tokfilter]');
    if(chip){ state._tokFilter=chip.getAttribute('data-tokfilter');
      announce('Filtered to '+chip.textContent); render(); return; }
  });
})();
document.getElementById('rsMine').addEventListener('click',function(){ setResort("minehead"); });
document.getElementById('rsBognor').addEventListener('click',function(){ setResort("bognor"); });
document.getElementById('brTerm').addEventListener('click',function(){ setBreak("term"); });
document.getElementById('brSummer').addEventListener('click',function(){ setBreak("summer"); });
document.getElementById('tkSlim').addEventListener('click',function(){ setTokenApproach("slim"); });
document.getElementById('tkPacks').addEventListener('click',function(){ setTokenApproach("packs"); });
document.getElementById('tkCurrent').addEventListener('click',function(){ setTokenApproach("current"); });
document.getElementById('dvMobile').addEventListener('click',function(){ setDevice("mobile"); });
document.getElementById('dvDesktop').addEventListener('click',function(){ setDevice("desktop"); });

resetParties();
render();
</script>
